# Dedicated instance; TLS and password are required even on loopback.
bind 127.0.0.1
protected-mode yes
port 0
tls-port 6380
tls-cert-file /etc/neko/redis/server.crt
tls-key-file /etc/neko/redis/server.key
tls-ca-cert-file /etc/neko/redis/ca.crt
# TLS server authentication + dedicated password. No client-certificate bypass elsewhere.
tls-auth-clients no
include /etc/neko/redis/redis-auth.conf
dir /var/lib/neko-redis
appendonly yes
appendfsync always
aof-load-truncated no
save ""
maxmemory 16mb
maxmemory-policy noeviction
loglevel warning
logfile ""
