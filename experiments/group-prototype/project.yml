name: NekoGroupPrototype
options:
  bundleIdPrefix: com.nekoprototype.isolated
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_ENTITLEMENTS: Prototype.entitlements
    SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/openmls/target/aarch64-apple-ios-sim/debug"
    OTHER_LDFLAGS: "$(inherited) -lneko_group_mls"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Probe:
    type: application
    platform: iOS
    sources: [App, HPKE.swift, Shared.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoprototype.isolated.Probe
        INFOPLIST_KEY_CFBundleDisplayName: Neko Group Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ProbeWidget
  ProbeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, HPKE.swift, Shared.swift]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoprototype.isolated.Probe.Widget
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: "$(inherited)"
    dependencies:
      - target: Probe
schemes:
  Probe:
    build:
      targets:
        Probe: all
    test:
      targets: [ProbeTests]
