name: PetIdentityProbe
options:
  deploymentTarget:
    iOS: "17.1"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    revision: b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGNING_ALLOWED: NO
  PROBE_SIGNING_ALLOWED: NO
  PROBE_BUILD_NUMBER: "1"
targets:
  PetIdentityProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated/ProbeAssets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/ThirdPartyNotices.txt
        buildPhase: resources
      - path: Resources/model-fixed.onnx
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: jp.nekowidget.petidentityprobe
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGNING_ALLOWED: $(PROBE_SIGNING_ALLOWED)
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: $(PROBE_TEAM_ID)
      CODE_SIGN_IDENTITY: $(PROBE_SIGN_IDENTITY)
      PROVISIONING_PROFILE_SPECIFIER: $(PROBE_PROFILE_UUID)
      OTHER_CODE_SIGN_FLAGS: $(PROBE_CODE_SIGN_FLAGS)
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: $(PROBE_BUILD_NUMBER)
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 猫識別・動作確認
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  PetIdentityProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PetIdentityProbe
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: jp.nekowidget.petidentityprobe.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  PetIdentityProbe:
    build:
      targets:
        PetIdentityProbe: all
    test:
      targets:
        - PetIdentityProbeTests
      gatherCoverageData: false
