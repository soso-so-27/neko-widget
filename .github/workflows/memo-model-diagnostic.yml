name: Private memo model diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect existing failed test result without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/soso-so-27/neko-widget/actions/artifacts/13078944619/zip > "$RUNNER_TEMP/result.zip"
          unzip -q "$RUNNER_TEMP/result.zip" -d "$RUNNER_TEMP/result"
          BUNDLE=$(find "$RUNNER_TEMP/result" -name '*.xcresult' -type d | head -1)
          xcrun xcresulttool get test-results summary --path "$BUNDLE"
          xcrun xcresulttool export diagnostics --path "$BUNDLE" --output-path "$RUNNER_TEMP/diagnostics"
          find "$RUNNER_TEMP/diagnostics" -type f | head -50
          find "$RUNNER_TEMP/diagnostics" -name '*.ips' -o -name '*.crash' | while read -r f; do cat "$f"; done
          find "$RUNNER_TEMP/diagnostics" -name '*.txt' -o -name '*.log' | while read -r f; do grep -E 'Precondition|Fatal error|APP_RECORD|assertion failed|crash|Exception Type' "$f" | tail -30 || true; done
