name: Private memo model diagnostic

on:
  workflow_dispatch:
    inputs:
      veterinary_models:
        description: Run existing private memo and veterinary persistence checks only
        type: boolean
        default: false
      notebook_models:
        description: Run isolated family notebook models only
        type: boolean
        default: false
      notebook_network_only:
        description: Preserve successful model checks and run only family transport/service probes
        type: boolean
        default: false
  push:
    branches: ['diagnostic/memo-veterinary-*']
    paths:
      - 'NekoWidget/NekoWidget/Services/PhotoMemoryNoteStore.swift'
      - 'NekoWidget/NekoWidget/Services/VeterinaryVisitStore.swift'
      - 'NekoWidget/NekoWidget/Services/PhotoMemoryNoteExporter.swift'
      - 'NekoWidget/ci/verify-photo-memory-notes.swift'
      - 'NekoWidget/ci/verify-veterinary-visits.swift'
      - 'NekoWidget/ci/verify-photo-memory-note-export.swift'

permissions:
  contents: read

concurrency:
  group: memo-model-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-models:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veterinary_models)
    name: Apple persistence models only - not release evidence
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify memo, consultation and export with injected local fixtures
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neko-memo-model-diagnostic"
          {
            xcrun swiftc -parse-as-library NekoWidget/Services/PhotoMemoryNoteStore.swift ci/verify-photo-memory-notes.swift -o "$RUNNER_TEMP/verify-notes"
            "$RUNNER_TEMP/verify-notes"
            xcrun swiftc -parse-as-library NekoWidget/Services/PhotoMemoryNoteStore.swift NekoWidget/Services/VeterinaryVisitStore.swift ci/verify-veterinary-visits.swift -o "$RUNNER_TEMP/verify-visits"
            "$RUNNER_TEMP/verify-visits"
            xcrun swiftc -parse-as-library NekoWidget/Services/PhotoMemoryNoteStore.swift NekoWidget/Services/PhotoMemoryNoteExporter.swift ci/verify-photo-memory-note-export.swift -o "$RUNNER_TEMP/verify-export"
            "$RUNNER_TEMP/verify-export"
          } 2>&1 | tee "$RUNNER_TEMP/neko-memo-model-diagnostic/models.log"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: memo-model-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/neko-memo-model-diagnostic
          retention-days: 7
          if-no-files-found: warn

  personal-store:
    if: github.event_name == 'workflow_dispatch' && !inputs.notebook_models && !inputs.veterinary_models
    name: Personal store concurrency probe - not release evidence
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check atomic snapshots, publication races, and existing state machine
        working-directory: NekoWidget
        run: |
          xcrun --sdk macosx swiftc -parse-as-library -D PERSONAL_REDISCOVERY_CHECKS \
            Shared/Models/WidgetManifest.swift Shared/Models/WidgetRenderPlan.swift \
            Shared/Storage/PersonalRediscoveryStore.swift ci/verify-personal-rediscovery.swift \
            -o "$RUNNER_TEMP/verify-personal-rediscovery"
          "$RUNNER_TEMP/verify-personal-rediscovery"

  family-notebook:
    if: github.event_name == 'workflow_dispatch' && inputs.notebook_models
    name: Family notebook model probe - not release evidence
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check isolated stores, encrypted sync, membership and private record preservation
        working-directory: NekoWidget
        run: |
          if [[ "${{ inputs.notebook_network_only }}" != "true" ]]; then bash ci/run-family-notebook-checks.sh; fi
          bash ci/run-family-notebook-network-checks.sh
