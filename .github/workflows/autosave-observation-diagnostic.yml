name: Automatic-save observation diagnostic

on:
  push:
    branches: ['diagnostic/autosave-status-*', 'diagnostic/autosave-efficiency-*', 'diagnostic/autosave-rebind-model-*', 'diagnostic/autosave-rebind-ui-*', 'diagnostic/autosave-opening-ui-*', 'diagnostic/autosave-opening-usage-*']
    paths:
      - '.github/workflows/autosave-observation-diagnostic.yml'
      - 'NekoWidget/NekoWidget/Services/AppRecordPersistence.swift'
      - 'NekoWidget/NekoWidget/Services/ManagedPreservationClient.swift'
      - 'NekoWidget/NekoWidget/Services/ManagedPreservationCoordinator.swift'
      - 'NekoWidget/NekoWidget/Services/ToolPreservation.swift'
      - 'NekoWidget/ci/verify-save-lifetime.swift'
      - 'NekoWidget/NekoWidgetUITests/PhotoPermissionUITests.swift'

permissions:
  contents: read

concurrency:
  group: autosave-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebind-model:
    if: startsWith(github.ref, 'refs/heads/diagnostic/autosave-rebind-model-')
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check actual metadata transaction with interrupted synthetic files
        working-directory: NekoWidget
        run: |
          set -euo pipefail
          python3 ci/prepare-preservation-opening-probe.py "$RUNNER_TEMP/opening.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/opening.swift" -o "$RUNNER_TEMP/opening"
          "$RUNNER_TEMP/opening"
          python3 ci/prepare-preservation-rebind-probe.py "$RUNNER_TEMP/rebind.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/rebind.swift" -o "$RUNNER_TEMP/rebind"
          "$RUNNER_TEMP/rebind"
          python3 ci/prepare-preservation-signin-probe.py "$RUNNER_TEMP/signin.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/signin.swift" -o "$RUNNER_TEMP/signin"
          "$RUNNER_TEMP/signin"
  observation:
    if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/autosave-rebind-model-') }}
    name: Synthetic automatic-save observation only (not release evidence)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run the isolated production-client and settings fixture
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-26-2", [])
          candidates=[d["udid"] for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not candidates: raise SystemExit("Required iOS 26.2 simulator unavailable")
          print(candidates[0])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          python3 ci/prepare-save-lifetime-check.py "$RUNNER_TEMP/save-lifetime.swift"
          swiftc -parse-as-library "$RUNNER_TEMP/save-lifetime.swift" ci/verify-save-lifetime.swift -o "$RUNNER_TEMP/save-lifetime"
          "$RUNNER_TEMP/save-lifetime"
          tests=(-only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveSettingsDoNotInvalidateSession
                 -only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveEfficiencyAndCleanupPriority
                 -only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticPartitionedRecordsMigrationAndRestore)
          if [[ "$GITHUB_REF" == refs/heads/diagnostic/autosave-rebind-ui-* ]]; then
            tests=(-only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveDestinationRebind)
          fi
          if [[ "$GITHUB_REF" == refs/heads/diagnostic/autosave-opening-ui-* ]]; then
            tests=(-only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveSettingsDoNotInvalidateSession
                   -only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveRefreshesVisibleUsage)
          fi
          if [[ "$GITHUB_REF" == refs/heads/diagnostic/autosave-opening-usage-* ]]; then
            tests=(-only-testing:NekoWidgetUITests/SoloMemoriesUITests/testAutomaticSaveRefreshesVisibleUsage)
          fi
          xcodebuild -project NekoWidget.xcodeproj -scheme NekoWidget -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/autosave-build" \
            -resultBundlePath "$RUNNER_TEMP/autosave-observation.xcresult" \
            "${tests[@]}" \
            -parallel-testing-enabled NO -testLanguage ja -testRegion JP \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES test 2>&1 | tee "$RUNNER_TEMP/autosave-observation.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'], 'autosave-observation.log').read_text()
          cases=re.findall(r"Test Case '-\[([^\]]+)\]' (started|passed|failed|skipped)",log)
          expected=['testAutomaticSaveSettingsDoNotInvalidateSession',
                    'testAutomaticSaveEfficiencyAndCleanupPriority',
                    'testAutomaticPartitionedRecordsMigrationAndRestore']
          if os.environ['GITHUB_REF'].startswith('refs/heads/diagnostic/autosave-rebind-ui-'):
              expected=['testAutomaticSaveDestinationRebind']
          if os.environ['GITHUB_REF'].startswith('refs/heads/diagnostic/autosave-opening-ui-'):
              expected=['testAutomaticSaveSettingsDoNotInvalidateSession', 'testAutomaticSaveRefreshesVisibleUsage']
          if os.environ['GITHUB_REF'].startswith('refs/heads/diagnostic/autosave-opening-usage-'):
              expected=['testAutomaticSaveRefreshesVisibleUsage']
          for name in expected:
              found=[state for case,state in cases if case == 'NekoWidgetUITests.SoloMemoriesUITests '+name]
              if found != ['started','passed']:
                  raise SystemExit(name+': must run and pass exactly once; skipped is not success.')
          if len(cases) != 2*len(expected): raise SystemExit('Unexpected native test selection')
          PY
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: autosave-observation-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autosave-observation.log
            ${{ runner.temp }}/autosave-observation.xcresult
          retention-days: 7
          if-no-files-found: warn
