name: iOS build check

on:
  push:
    paths:
      - "NekoWidget/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "NekoWidget/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-without-signing:
    name: Build app and widget without signing
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Xcode installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Verify sharing release privacy gates
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/test-validate-sharing-release.py
          python3 ci/test-validate-sharing-runtime-self-test.py

      - name: Verify Swift pairing protocol vectors
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            ci/verify-pairing-protocol-vectors.swift \
            -o "$RUNNER_TEMP/verify-pairing-protocol-vectors"
          "$RUNNER_TEMP/verify-pairing-protocol-vectors" \
            ci/fixtures/pairing-protocol-v1.json

      - name: Verify Swift pairing API response contract
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            NekoWidget/Services/PairingAPIClient.swift \
            ci/verify-pairing-api-responses.swift \
            -o "$RUNNER_TEMP/verify-pairing-api-responses"
          "$RUNNER_TEMP/verify-pairing-api-responses" \
            ci/fixtures/pairing-api-v1-responses.json

      - name: Verify Swift sharing protocol vectors
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Sharing/DailySharingCore.swift \
            ci/verify-sharing-protocol-vectors.swift \
            -o "$RUNNER_TEMP/verify-sharing-protocol-vectors"
          "$RUNNER_TEMP/verify-sharing-protocol-vectors" \
            ci/fixtures/sharing-protocol-v1.json

      - name: Verify Swift sharing API response contract
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Sharing/DailySharingCore.swift \
            Shared/AppGroup/SharedContainer.swift \
            Shared/Storage/AtomicJSON.swift \
            NekoWidget/Services/PairingAPIClient.swift \
            NekoWidget/Services/DailySharingStore.swift \
            NekoWidget/Services/DailySharingAPIClient.swift \
            ci/verify-sharing-api-responses.swift \
            -o "$RUNNER_TEMP/verify-sharing-api-responses"
          "$RUNNER_TEMP/verify-sharing-api-responses" \
            ci/fixtures/sharing-api-v1-responses.json

      - name: Verify normalized bbox posture classification
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'VNDetectAnimalBodyPoseRequest|AnimalPostureClassifier' \
            NekoWidget/Services/PhotoLibraryScanner.swift; then
            echo "PhotoLibraryScanner must not invoke the retired joint pipeline" >&2
            exit 1
          fi
          if test -e NekoWidget/Services/AnimalPostureClassifier.swift; then
            echo "Retired joint classifier must not be part of the app target" >&2
            exit 1
          fi
          if grep -Eq 'scanState\.purpose[[:space:]]*=[[:space:]]*\.postureRepair' \
            NekoWidget/ViewModels/AppViewModel.swift; then
            echo "AppViewModel must not re-arm the decode-only posture repair route" >&2
            exit 1
          fi
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            ci/verify-album-classification.swift \
            -o "$RUNNER_TEMP/verify-album-classification"
          "$RUNNER_TEMP/verify-album-classification"

      - name: Verify grouped album location classification
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Services/HomeLocationClassifier.swift \
            ci/verify-album-location.swift \
            -o "$RUNNER_TEMP/verify-album-location"
          "$RUNNER_TEMP/verify-album-location"

      - name: Verify grouped album ordering and migration defaults
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Views/GrowthAlbumSelector.swift \
            NekoWidget/Views/AppPresentationModels.swift \
            ci/verify-album-grouping.swift \
            -o "$RUNNER_TEMP/verify-album-grouping"
          "$RUNNER_TEMP/verify-album-grouping"

      - name: Verify scan recovery and Widget eligibility policies
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          scanner="NekoWidget/Services/PhotoLibraryScanner.swift"
          if grep -Fq 'minimumCatAreaRatio' "$scanner"; then
            echo "Detector must not apply the Widget area threshold" >&2
            exit 1
          fi
          grep -Fq 'case .localRecovery512: .fastFormat' "$scanner"
          grep -Fq 'case .localRecovery512: CGSize(width: 512, height: 512)' "$scanner"
          grep -Fq 'case .highResolution2048: CGSize(width: 2_048, height: 2_048)' "$scanner"
          if grep -Eq 'isNetworkAccessAllowed[[:space:]]*=[[:space:]]*true' "$scanner"; then
            echo "Photo scan fallback must not enable network access" >&2
            exit 1
          fi
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Services/PhotoSelectors.swift \
            ci/verify-scan-recovery-policy.swift \
            -o "$RUNNER_TEMP/verify-scan-recovery-policy"
          "$RUNNER_TEMP/verify-scan-recovery-policy"

      - name: Verify growth album selection
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Views/GrowthAlbumSelector.swift \
            NekoWidget/Views/AppPresentationModels.swift \
            ci/verify-growth-album.swift \
            -o "$RUNNER_TEMP/verify-growth-album"
          "$RUNNER_TEMP/verify-growth-album"

      - name: Verify local photo-book progress and export boundaries
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Services/PhotoBookPolicy.swift \
            ci/verify-photo-book-policy.swift \
            -o "$RUNNER_TEMP/verify-photo-book-policy"
          "$RUNNER_TEMP/verify-photo-book-policy"

          exporter="NekoWidget/Services/PhotoBookPDFExporter.swift"
          grep -Fq 'options.isNetworkAccessAllowed = false' "$exporter"
          if grep -Eq 'isNetworkAccessAllowed[[:space:]]*=[[:space:]]*true' "$exporter"; then
            echo "Photo-book export must not download iCloud photos" >&2
            exit 1
          fi
          if grep -R -Eq '\.badge[[:space:]]*\(' NekoWidget --include='*.swift'; then
            echo "Build 19 must not add a prompting badge" >&2
            exit 1
          fi

      - name: Verify cat candidate curation state and export privacy
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Models/CatCandidateCuration.swift \
            ci/verify-cat-curation.swift \
            -o "$RUNNER_TEMP/verify-cat-curation"
          "$RUNNER_TEMP/verify-cat-curation"

      - name: Verify multi-cat household identity and migration
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatCandidateCuration.swift \
            Shared/Models/CatHouseholdIdentity.swift \
            Shared/Models/NekoWidgetError.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/AppGroup/SharedContainer.swift \
            NekoWidget/Services/CatHouseholdIdentityStore.swift \
            ci/verify-cat-household-identity.swift \
            -o "$RUNNER_TEMP/verify-cat-household-identity"
          "$RUNNER_TEMP/verify-cat-household-identity"

      - name: Verify multi-cat presentation and posture diagnostics
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            NekoWidget/Services/CatSimilarityGroupingCore.swift \
            NekoWidget/Views/CatProfilesPresentation.swift \
            ci/verify-cat-profiles-presentation.swift \
            -o "$RUNNER_TEMP/verify-cat-profiles-presentation"
          "$RUNNER_TEMP/verify-cat-profiles-presentation"
          if grep -Fq 'cat-similarity-review-link' NekoWidget/Views/CatProfilesView.swift; then
            echo "Deprecated FeaturePrint review route became visible again" >&2
            exit 1
          fi
          grep -Fq 'Text(CatIndividualRecognitionCopy.unavailable)' \
            NekoWidget/Views/CatProfilesView.swift

      - name: Verify local cat similarity grouping
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            NekoWidget/Services/CatSimilarityGroupingCore.swift \
            ci/verify-cat-similarity-grouping.swift \
            -o "$RUNNER_TEMP/verify-cat-similarity-grouping"
          "$RUNNER_TEMP/verify-cat-similarity-grouping"

      - name: Verify cat similarity review presentation
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Views/CatSimilarityReviewPresentation.swift \
            ci/verify-cat-similarity-review-presentation.swift \
            -o "$RUNNER_TEMP/verify-cat-similarity-review-presentation"
          "$RUNNER_TEMP/verify-cat-similarity-review-presentation"

      - name: Verify cat similarity privacy boundary
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          service="NekoWidget/Services/CatSimilarityGroupingService.swift"
          core="NekoWidget/Services/CatSimilarityGroupingCore.swift"
          grep -Fq 'static let requestRevision = 2' "$core"
          grep -Fq 'options.isNetworkAccessAllowed = false' "$service"
          if grep -REn \
            'VNFeaturePrint|VNGenerateImageFeaturePrintRequest|CatSimilarityCandidate(Group|Instance)' \
            Shared/Sharing NekoWidget/Services/JSONExporter.swift SharingService; then
            echo "FeaturePrint proposal data crossed a sharing/export boundary" >&2
            exit 1
          fi
          if grep -En 'SharedLog\.|JSONEncoder\(|:[[:space:]]*Codable|CatHouseholdIdentityStore\(' \
            "$service"; then
            echo "Similarity service gained persistence or logging authority" >&2
            exit 1
          fi

      - name: Verify five-screen onboarding presentation
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Views/OnboardingPresentation.swift \
            ci/verify-onboarding-presentation.swift \
            -o "$RUNNER_TEMP/verify-onboarding-presentation"
          "$RUNNER_TEMP/verify-onboarding-presentation"

      - name: Verify real Widget guide screenshots
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          catalog = Path("NekoWidget/Assets.xcassets")
          names = [
              "onboarding-widget-step-1",
              "onboarding-widget-step-2-ios18",
              "onboarding-widget-step-3",
              "onboarding-widget-step-4",
          ]
          for name in names:
              imageset = catalog / f"{name}.imageset"
              png = imageset / f"{name}.png"
              contents = json.loads((imageset / "Contents.json").read_text(encoding="utf-8"))
              filenames = {
                  image.get("filename")
                  for image in contents.get("images", [])
                  if image.get("filename")
              }
              if png.name not in filenames:
                  raise SystemExit(f"{name} is not referenced by its asset catalogue")
              with png.open("rb") as stream:
                  if stream.read(8) != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"{name} is not a PNG")
                  if struct.unpack(">I", stream.read(4))[0] < 8 or stream.read(4) != b"IHDR":
                      raise SystemExit(f"{name} has no valid IHDR")
                  width, height = struct.unpack(">II", stream.read(8))
              if width < 900 or height < 1800 or height <= width:
                  raise SystemExit(f"{name} has unexpected dimensions: {width}x{height}")
              print(f"{name}: {width}x{height}")
          PY

      - name: Build app and widget for iOS Simulator
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NekoWidget.xcodeproj \
            -scheme NekoWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NekoWidgetBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Upload build result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-result-${{ github.run_id }}
          path: ${{ runner.temp }}/NekoWidgetBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7

  simulator-smoke-test:
    name: Launch app and scan fixtures in Simulator
    needs: build-without-signing
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # iOS 26.2 accepts `simctl privacy grant photos` without changing
      # PhotoKit's read/write status. Use the stable runtime for app smoke CI.
      SMOKE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Simulator smoke test
        working-directory: NekoWidget
        shell: bash
        run: bash ci/run-simulator-smoke.sh

      - name: Upload Simulator smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-smoke-artifacts
          if-no-files-found: warn
          retention-days: 7

  sharing-runtime-matrix:
    name: Sharing runtime self-test (iOS 18.5 / 26.2)
    needs: build-without-signing
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run sharing runtime matrix
        working-directory: NekoWidget
        shell: bash
        run: bash ci/run-sharing-runtime-matrix.sh

      - name: Upload sharing runtime matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-sharing-runtime-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-sharing-runtime-matrix
          if-no-files-found: warn
          retention-days: 7
