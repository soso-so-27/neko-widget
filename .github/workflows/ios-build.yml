name: iOS build check

on:
  push:
    paths:
      - "NekoWidget/**"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "NekoWidget/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-without-signing:
    name: Build disabled app and extensions without signing
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Verify sharing release privacy gates
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/test-disabled-release-config.py
          python3 ci/test-disabled-release-build-settings.py
          python3 ci/test-pairing-only-release-config.py
          python3 ci/test-media-staging-release-config.py
          python3 ci/test-validate-sharing-release.py
          python3 ci/test-signed-artifact-authentication.py
          python3 ci/test-validate-sharing-runtime-self-test.py
          python3 ci/test-public-policy-site.py
          python3 ci/test-limited-external-beta-reporting.py
          python3 ci/test-app-store-local-only-readiness.py
          python3 ci/test-export-temp-file-lifecycle.py
          python3 ci/test-photo-permission-bootstrap.py
          python3 ci/test-diagnostic-log-privacy.py
          python3 ci/test-app-store-screenshot-workflow.py
          python3 ci/test-background-moment-refresh.py

      - name: Verify Swift pairing protocol vectors
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            ci/verify-pairing-protocol-vectors.swift \
            -o "$RUNNER_TEMP/verify-pairing-protocol-vectors"
          "$RUNNER_TEMP/verify-pairing-protocol-vectors" \
            ci/fixtures/pairing-protocol-v1.json \
            ci/fixtures/device-recovery-protocol-v2.json

      - name: Verify Swift pairing API response contract
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Sharing/SharingAPIConfiguration.swift \
            NekoWidget/Services/PairingAPIClient.swift \
            ci/verify-pairing-api-responses.swift \
            -o "$RUNNER_TEMP/verify-pairing-api-responses"
          "$RUNNER_TEMP/verify-pairing-api-responses" \
            ci/fixtures/pairing-api-v1-responses.json

      - name: Verify Swift sharing protocol vectors
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Sharing/DailySharingCore.swift \
            ci/verify-sharing-protocol-vectors.swift \
            -o "$RUNNER_TEMP/verify-sharing-protocol-vectors"
          "$RUNNER_TEMP/verify-sharing-protocol-vectors" \
            ci/fixtures/sharing-protocol-v1.json

      - name: Verify Swift sharing API response contract
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Sharing/DailySharingCore.swift \
            Shared/AppGroup/SharedContainer.swift \
            Shared/Storage/AtomicJSON.swift \
            Shared/Sharing/SharingAPIConfiguration.swift \
            NekoWidget/Services/PairingAPIClient.swift \
            NekoWidget/Services/DailySharingStore.swift \
            NekoWidget/Services/DailySharingAPIClient.swift \
            ci/verify-sharing-api-responses.swift \
            -o "$RUNNER_TEMP/verify-sharing-api-responses"
          "$RUNNER_TEMP/verify-sharing-api-responses" \
            ci/fixtures/sharing-api-v1-responses.json

      - name: Verify append-only one-photo moment contract
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Sharing/MomentSharingCore.swift \
            ci/verify-moment-sharing-core.swift \
            -o "$RUNNER_TEMP/verify-moment-sharing-core"
          "$RUNNER_TEMP/verify-moment-sharing-core" \
            ci/fixtures/window-name-protocol-v1.json

          project=NekoWidget.xcodeproj/project.pbxproj
          grep -Fq 'NekoWidgetShareExtension.appex in Embed App Extensions' "$project"
          grep -Fq 'MomentSharingCore.swift in Sources' "$project"
          grep -Fq 'MomentSharingAPIClient.swift in Sources' "$project"
          grep -Fq '70000000000000000000000D /* WidgetManifest.swift in Sources */' "$project"
          grep -Fq '70000000000000000000000E /* WidgetRenderPlan.swift in Sources */' "$project"
          grep -Fq 'NSExtensionActivationSupportsImageWithMaxCount' \
            NekoWidgetShareExtension/Info.plist
          grep -Fq '<integer>1</integer>' NekoWidgetShareExtension/Info.plist
          grep -Fq '<string>analysis</string>' NekoWidget/NekoWidget.entitlements
          if grep -Fq 'sensitivecontentanalysis' \
            NekoWidgetShareExtension/NekoWidgetShareExtension.entitlements; then
            echo 'Capture-only Share Extension must not have Sensitive Content Analysis entitlement' >&2
            exit 1
          fi
          if grep -Eq 'DailySharing|maximumDaily|generationID' \
            NekoWidgetShareExtension/*.swift; then
            echo 'Share Extension must not use the retired daily-sharing protocol' >&2
            exit 1
          fi

          grep -Fq 'case committing' Shared/Sharing/MomentSharingStore.swift
          grep -Fq 'expected: .committing' NekoWidget/Services/MomentSharingCoordinator.swift
          grep -Fq 'MOMENT_RUNTIME_ENABLED": "NO"' SharingService/wrangler.example.jsonc
          grep -Fq 'IDEMPOTENCY_TTL_SECONDS": "172800"' \
            SharingService/wrangler.example.jsonc
          grep -Fq 'const MOMENT_UPLOAD_TTL_SECONDS = 60 * 60' \
            SharingService/src/moments.ts
          grep -Fq 'const MOMENT_REPORT_ONLY_TTL_SECONDS = 24 * 60 * 60' \
            SharingService/src/moments.ts
          grep -Fq 'const REPORT_CONTENT_TTL_SECONDS = 7 * 86_400' \
            SharingService/src/moments.ts
          grep -Fq 'moment_runtime_disabled' SharingService/src/index.ts
          grep -Fqx 'SHARING_SHARE_EXTENSION_HANDOFF_ENABLED = NO' Config.xcconfig
          grep -Fqx 'SHARING_SHARE_EXTENSION_SEND_ENABLED = NO' Config.xcconfig
          grep -Fq '<key>SharingShareExtensionHandoffEnabled</key>' \
            NekoWidget/Info.plist
          grep -Fq '<key>SharingShareExtensionHandoffEnabled</key>' \
            NekoWidgetShareExtension/Info.plist
          grep -Fq '<key>SharingShareExtensionSendEnabled</key>' \
            NekoWidget/Info.plist
          grep -Fq '<key>SharingShareExtensionSendEnabled</key>' \
            NekoWidgetShareExtension/Info.plist
          grep -Fq 'configuration.isShareExtensionHandoffAvailable' \
            NekoWidgetShareExtension/ShareViewController.swift
          grep -Fq 'MomentShareHandoffStore.stageCapture' \
            NekoWidgetShareExtension/MomentShareIngressService.swift
          grep -Fq 'PairingInstallationGuard.bootstrap()' \
            NekoWidget/Services/MomentSharingCoordinator.swift
          grep -Fq 'refreshAdmissionsAndDrain' \
            NekoWidget/Services/MomentSharingCoordinator.swift
          grep -Fq 'Direct Share Extension delivery is permanently blocked' \
            ci/validate-sharing-release.py
          grep -Fq 'NSPrivacyAccessedAPICategoryFileTimestamp' NekoWidget/PrivacyInfo.xcprivacy
          grep -Fq '<string>C617.1</string>' NekoWidget/PrivacyInfo.xcprivacy
          grep -Fq 'NSPrivacyAccessedAPICategoryFileTimestamp' \
            NekoWidgetShareExtension/PrivacyInfo.xcprivacy
          grep -Fq '<string>C617.1</string>' \
            NekoWidgetShareExtension/PrivacyInfo.xcprivacy
          grep -Fq 'NSPrivacyAccessedAPICategoryFileTimestamp' \
            NekoWidgetWidget/PrivacyInfo.xcprivacy
          grep -Fq '<string>C617.1</string>' \
            NekoWidgetWidget/PrivacyInfo.xcprivacy
          grep -Fq 'F00000000000000000000303 /* PrivacyInfo.xcprivacy */' \
            NekoWidget.xcodeproj/project.pbxproj
          grep -Fq '740000000000000000000001 /* PrivacyInfo.xcprivacy in Resources */' \
            NekoWidget.xcodeproj/project.pbxproj
          grep -Fq 'プレビュー・送信されません' NekoWidget/Views/SettingsView.swift
          if grep -Eq '新しい一枚をウィジェットへ優先表示|最近届いた写真と、自分が送った写真を同じ履歴' \
            NekoWidget/Views/SettingsView.swift; then
            echo 'Review preview must not present future Widget/sent-history work as implemented' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          source = Path("NekoWidget/ViewModels/AppViewModel.swift").read_text()
          start = source.index("func start() async")
          launch_sync = source.index('synchronizeMomentSharing(trigger: "launch")', start)
          curation_guard = source.index("guard await loadCatCandidateCuration()", start)
          foreground = source.index("func syncOnActive() async")
          foreground_sync = source.index('synchronizeMomentSharing(trigger: "foreground")', foreground)
          identity_guard = source.index("guard catIdentityLoadState == .ready", foreground)
          if not launch_sync < curation_guard or not foreground_sync < identity_guard:
              raise SystemExit("Moment sync must not depend on scanner or cat-identity storage")

          coordinator = Path("NekoWidget/Services/MomentSharingCoordinator.swift").read_text()
          authorization = coordinator.index("private func loadAuthorization()")
          bootstrap = coordinator.index("PairingInstallationGuard.bootstrap()", authorization)
          credential = coordinator.index("PairingKeychainStore.load(", authorization)
          if not bootstrap < credential:
              raise SystemExit("Host moment network authorization must validate installation first")

          project = Path("NekoWidget.xcodeproj/project.pbxproj").read_text()
          share_start = project.index("A0000000000000000000002B /* Sources */ = {")
          share_end = project.index("/* End PBXSourcesBuildPhase section */", share_start)
          share_sources = project[share_start:share_end]
          required = {
              "MomentShareHandoffStore.swift in Sources",
              "SharingAPIConfiguration.swift in Sources",
              "MomentShareIngressService.swift in Sources",
              "MomentCanonicalPreviewBuilder.swift in Sources",
              "MomentSharingCore.swift in Sources",
              "ShareViewController.swift in Sources",
          }
          forbidden = {
              "PairingCore.swift in Sources",
              "PairingKeychainStore.swift in Sources",
              "MomentSharingStore.swift in Sources",
              "PairingAPIClient.swift in Sources",
              "MomentSharePreparationService.swift in Sources",
              "MomentSharingAPIClient.swift in Sources",
              "MomentShareExtensionSender.swift in Sources",
          }
          missing = sorted(value for value in required if value not in share_sources)
          leaked = sorted(value for value in forbidden if value in share_sources)
          if missing or leaked:
              raise SystemExit(
                  f"Capture-only Share target boundary failed; missing={missing}, leaked={leaked}"
              )
          share_framework_start = project.index(
              "A0000000000000000000002C /* Frameworks */ = {"
          )
          share_framework_end = project.index(
              "/* End PBXFrameworksBuildPhase section */",
              share_framework_start,
          )
          share_frameworks = project[share_framework_start:share_framework_end]
          if "SensitiveContentAnalysis.framework" in share_frameworks:
              raise SystemExit(
                  "Capture-only Share target must not link SensitiveContentAnalysis"
              )

          share_code = "\n".join(
              path.read_text()
              for path in Path("NekoWidgetShareExtension").glob("*.swift")
          )
          forbidden_symbols = (
              "PairingStateStore",
              "PairingKeychainStore",
              "MomentSharingStateStore",
              "URLSession",
              "SensitiveContentAnalysis",
              "reserve(",
              "upload(",
              "commit(",
          )
          leaked_symbols = [value for value in forbidden_symbols if value in share_code]
          if leaked_symbols:
              raise SystemExit(
                  f"Capture-only Share code crosses host authorization boundary: {leaked_symbols}"
              )

          keychain = Path("Shared/Sharing/PairingKeychainStore.swift").read_text()
          if "jp.nekowidget.sharing.credentials.v2.host" not in keychain:
              raise SystemExit("Pairing credential must use the host-only v2 Keychain service")
          if "kSecAttrAccessibleWhenUnlockedThisDeviceOnly" not in keychain:
              raise SystemExit("Pairing credential must remain this-device-only")
          active_query_start = keychain.index("private static func itemQuery(")
          active_query_end = keychain.index(
              "private static func deleteLegacySharedCredential(",
              active_query_start,
          )
          if "kSecAttrAccessGroup" in keychain[active_query_start:active_query_end]:
              raise SystemExit("Active room credential must use the host default Keychain group")
          PY

      - name: Verify one-photo sharing presentation states
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Routing/DeepLink.swift \
            NekoWidget/Views/MomentSharingPresentation.swift \
            ci/verify-moment-sharing-presentation.swift \
            -o "$RUNNER_TEMP/verify-moment-sharing-presentation"
          "$RUNNER_TEMP/verify-moment-sharing-presentation"
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Sharing/PairingCore.swift \
            NekoWidget/Views/PairingPresentation.swift \
            ci/verify-pairing-presentation.swift \
            -o "$RUNNER_TEMP/verify-pairing-presentation"
          "$RUNNER_TEMP/verify-pairing-presentation"
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/WidgetManifest.swift \
            Shared/Models/WidgetRenderPlan.swift \
            ci/verify-private-window-display-name.swift \
            -o "$RUNNER_TEMP/verify-private-window-display-name"
          "$RUNNER_TEMP/verify-private-window-display-name"
          python3 ci/test-family-window-widget-boundaries.py
          grep -Fq 'MomentSharingPresentation.swift in Sources' \
            NekoWidget.xcodeproj/project.pbxproj

      - name: Verify normalized bbox posture classification
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'VNDetectAnimalBodyPoseRequest|AnimalPostureClassifier' \
            NekoWidget/Services/PhotoLibraryScanner.swift; then
            echo "PhotoLibraryScanner must not invoke the retired joint pipeline" >&2
            exit 1
          fi
          if test -e NekoWidget/Services/AnimalPostureClassifier.swift; then
            echo "Retired joint classifier must not be part of the app target" >&2
            exit 1
          fi
          if grep -Eq 'scanState\.purpose[[:space:]]*=[[:space:]]*\.postureRepair' \
            NekoWidget/ViewModels/AppViewModel.swift; then
            echo "AppViewModel must not re-arm the decode-only posture repair route" >&2
            exit 1
          fi
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            ci/verify-album-classification.swift \
            -o "$RUNNER_TEMP/verify-album-classification"
          "$RUNNER_TEMP/verify-album-classification"

      - name: Verify grouped album location classification
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Services/HomeLocationClassifier.swift \
            ci/verify-album-location.swift \
            -o "$RUNNER_TEMP/verify-album-location"
          "$RUNNER_TEMP/verify-album-location"

      - name: Verify grouped album ordering and migration defaults
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Views/GrowthAlbumSelector.swift \
            NekoWidget/Views/AppPresentationModels.swift \
            ci/verify-album-grouping.swift \
            -o "$RUNNER_TEMP/verify-album-grouping"
          "$RUNNER_TEMP/verify-album-grouping"
          main_tab="NekoWidget/Views/MainTabView.swift"
          grep -Fq 'from: catPhotos' "$main_tab"
          grep -Fq '? settings.catLifeReference' "$main_tab"
          grep -Fq '.onChange(of: settings.catLifeReference)' "$main_tab"

      - name: Verify monthly window selection
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Views/GrowthAlbumSelector.swift \
            NekoWidget/Views/AppPresentationModels.swift \
            NekoWidget/Views/MonthlyWindowPresentation.swift \
            ci/verify-monthly-window.swift \
            -o "$RUNNER_TEMP/verify-monthly-window"
          "$RUNNER_TEMP/verify-monthly-window"

      - name: Verify scan recovery and Widget eligibility policies
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          scanner="NekoWidget/Services/PhotoLibraryScanner.swift"
          if grep -Fq 'minimumCatAreaRatio' "$scanner"; then
            echo "Detector must not apply the Widget area threshold" >&2
            exit 1
          fi
          grep -Fq 'case .localRecovery512: .fastFormat' "$scanner"
          grep -Fq 'case .localRecovery512: CGSize(width: 512, height: 512)' "$scanner"
          grep -Fq 'case .highResolution2048: CGSize(width: 2_048, height: 2_048)' "$scanner"
          if grep -Eq 'isNetworkAccessAllowed[[:space:]]*=[[:space:]]*true' "$scanner"; then
            echo "Photo scan fallback must not enable network access" >&2
            exit 1
          fi
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Services/PhotoSelectors.swift \
            ci/verify-scan-recovery-policy.swift \
            -o "$RUNNER_TEMP/verify-scan-recovery-policy"
          "$RUNNER_TEMP/verify-scan-recovery-policy"

      - name: Verify growth album selection
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatDetection.swift \
            Shared/Models/AssetRecord.swift \
            Shared/Models/ScanState.swift \
            Shared/Models/LibrarySnapshot.swift \
            NekoWidget/Views/GrowthAlbumSelector.swift \
            NekoWidget/Views/AppPresentationModels.swift \
            ci/verify-growth-album.swift \
            -o "$RUNNER_TEMP/verify-growth-album"
          "$RUNNER_TEMP/verify-growth-album"

      - name: Verify local photo-summary and export boundaries
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Services/PhotoBookPolicy.swift \
            ci/verify-photo-book-policy.swift \
            -o "$RUNNER_TEMP/verify-photo-book-policy"
          "$RUNNER_TEMP/verify-photo-book-policy"

          exporter="NekoWidget/Services/PhotoBookPDFExporter.swift"
          grep -Fq 'options.isNetworkAccessAllowed = true' "$exporter"
          grep -Fq 'timeoutNanoseconds: UInt64 = 120_000_000_000' "$exporter"
          grep -Fq 'Label("思い出", systemImage: "photo.stack.fill")' \
            NekoWidget/Views/MainTabView.swift
          grep -Fq 'Label("今日", systemImage: "sun.max.fill")' \
            NekoWidget/Views/MainTabView.swift
          grep -Fq 'Label("まど", systemImage: "rectangle.split.2x2")' \
            NekoWidget/Views/MainTabView.swift
          grep -Fq 'Text("自動アルバム")' \
            NekoWidget/Views/HomeView.swift
          grep -Fq 'NavigationLink(value: TodayRoute.automaticAlbums)' \
            NekoWidget/Views/HomeView.swift
          grep -Fq 'accessibilityIdentifier("window-settings-button")' \
            NekoWidget/Views/HomeView.swift
          grep -Fq 'LikedPhotosView(' NekoWidget/Views/MainTabView.swift
          grep -Fq 'exportPhotoBook: exportPhotoBook' \
            NekoWidget/Views/MainTabView.swift
          grep -Fq 'selectedIdentifiers: identifiers' \
            NekoWidget/App/AppRootView.swift
          grep -Fq 'PhotoBrowserPager(' \
            NekoWidget/Views/LikedPhotosView.swift
          grep -Fq 'private var footerHeight: CGFloat = 48' \
            NekoWidget/Views/LikedPhotosView.swift
          grep -Fq 'Button(isSelectingForExport ? "キャンセル" : "PDFにまとめる")' \
            NekoWidget/Views/LikedPhotosView.swift
          grep -Fq 'Text("残した順")' \
            NekoWidget/Views/LikedPhotosView.swift
          grep -Fq 'LikedPhotoOrderingPolicy.comesBefore(' \
            NekoWidget/App/AppRootView.swift
          grep -Fq 'に思い出へ残した猫の写真' \
            NekoWidget/Views/LikedPhotosView.swift
          grep -Fq '.navigationDestination(isPresented: $opensActiveWindow)' \
            NekoWidget/Views/MainTabView.swift
          if grep -Fq '.sheet(isPresented: $opensActiveWindow)' \
            NekoWidget/Views/MainTabView.swift; then
            echo "The private window must not cover the main tab bar" >&2
            exit 1
          fi
          if grep -Fq 'Text("ハートは相手へ・思い出は自分だけ")' \
            NekoWidget/Views/FamilyWindowView.swift; then
            echo "The private-window photo actions must not repeat explanatory copy" >&2
            exit 1
          fi
          grep -Fq 'accessibilityIdentifier("family-window-saved-memory-state")' \
            NekoWidget/Views/FamilyWindowView.swift
          grep -Fq 'return canRetry ? "ハートを再送" : "ハートを送れません"' \
            NekoWidget/Views/FamilyWindowView.swift
          grep -Fq 'heart?.phase == .sent' \
            NekoWidget/Views/FamilyWindowView.swift
          grep -Fq 'systemImage: "bookmark"' \
            NekoWidgetWidget/NekoWidgetView.swift
          if grep -Eq 'foregroundStyle\(\.pink\)|systemImage:.*star' \
            NekoWidgetWidget/NekoWidgetView.swift \
            NekoWidget/Views/FamilyWindowView.swift; then
            echo "Private-window memory and heart controls must use one visual language" >&2
            exit 1
          fi
          if grep -Eq 'photoYearSections|LikedPhotoYearSection' \
            NekoWidget/Views/LikedPhotosView.swift; then
            echo "思い出 must remain one manually-added ordered collection" >&2
            exit 1
          fi
          grep -Fq '"pager": "bounded-native-paging"' \
            NekoWidget/Views/LikedPhotosView.swift
          if grep -Fq 'LazyHStack(' NekoWidget/Views/LikedPhotosView.swift; then
            echo "The photo browser must keep a bounded page window" >&2
            exit 1
          fi
          grep -Fq 'options.deliveryMode = .opportunistic' \
            NekoWidget/Views/PhotoAssetImageView.swift
          grep -Fq 'if !showsFullImage, !degraded {' \
            NekoWidget/Views/PhotoAssetImageView.swift
          grep -Fq 'PhotoThumbnailCropPolicy.cropRect(' \
            NekoWidget/Views/PhotoAssetImageView.swift
          grep -Fq 'verifyThumbnailCropAlwaysFillsTheFrame()' \
            ci/verify-scan-recovery-policy.swift
          if grep -Eq 'fastFormat|PhotoAssetThumbnailComposer' \
            NekoWidget/Views/PhotoAssetImageView.swift; then
            echo "Grid previews must upgrade to an uncached final thumbnail without letterboxing" >&2
            exit 1
          fi
          grep -Fq 'private actor PhotoAssetResolver' \
            NekoWidget/Views/PhotoAssetImageView.swift
          if grep -Fq 'withAnimation(' NekoWidget/Views/PhotoAssetImageView.swift; then
            echo "Grid thumbnail callbacks must not animate every PhotoKit delivery" >&2
            exit 1
          fi
          grep -Fq 'static let minimumInterval: TimeInterval = 1.0' \
            NekoWidget/Services/PhotoSelectors.swift
          if grep -Fq '.badge(' NekoWidget/Views/MainTabView.swift; then
            echo "Top-level collection totals must not use unread-style badges" >&2
            exit 1
          fi
          if grep -Fq '.tag(AppTab.settings)' NekoWidget/Views/MainTabView.swift; then
            echo "Settings must stay under the Window instead of a peer tab" >&2
            exit 1
          fi

      - name: Verify cat candidate curation state and export privacy
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            Shared/Models/CatCandidateCuration.swift \
            ci/verify-cat-curation.swift \
            -o "$RUNNER_TEMP/verify-cat-curation"
          "$RUNNER_TEMP/verify-cat-curation"

      - name: Verify multi-cat household identity and migration
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/AppSettings.swift \
            Shared/Models/NormalizedRect.swift \
            Shared/Models/CatCandidateCuration.swift \
            Shared/Models/CatHouseholdIdentity.swift \
            Shared/Models/NekoWidgetError.swift \
            Shared/Models/WidgetRenderPlan.swift \
            Shared/Models/WidgetManifest.swift \
            Shared/Storage/AtomicJSON.swift \
            Shared/AppGroup/SharedContainer.swift \
            NekoWidget/Services/CatHouseholdIdentityStore.swift \
            ci/verify-cat-household-identity.swift \
            -o "$RUNNER_TEMP/verify-cat-household-identity"
          "$RUNNER_TEMP/verify-cat-household-identity"

      - name: Verify multi-cat presentation and posture diagnostics
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            NekoWidget/Services/CatSimilarityGroupingCore.swift \
            NekoWidget/Views/CatProfilesPresentation.swift \
            ci/verify-cat-profiles-presentation.swift \
            -o "$RUNNER_TEMP/verify-cat-profiles-presentation"
          "$RUNNER_TEMP/verify-cat-profiles-presentation"
          if grep -Fq 'cat-similarity-review-link' NekoWidget/Views/CatProfilesView.swift; then
            echo "Deprecated FeaturePrint review route became visible again" >&2
            exit 1
          fi
          grep -Fq 'Text(CatIndividualRecognitionCopy.unavailable)' \
            NekoWidget/Views/CatProfilesView.swift

      - name: Verify local cat similarity grouping
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            Shared/Models/NormalizedRect.swift \
            NekoWidget/Services/CatSimilarityGroupingCore.swift \
            ci/verify-cat-similarity-grouping.swift \
            -o "$RUNNER_TEMP/verify-cat-similarity-grouping"
          "$RUNNER_TEMP/verify-cat-similarity-grouping"

      - name: Verify cat similarity review presentation
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Views/CatSimilarityReviewPresentation.swift \
            ci/verify-cat-similarity-review-presentation.swift \
            -o "$RUNNER_TEMP/verify-cat-similarity-review-presentation"
          "$RUNNER_TEMP/verify-cat-similarity-review-presentation"

      - name: Verify cat similarity privacy boundary
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          service="NekoWidget/Services/CatSimilarityGroupingService.swift"
          core="NekoWidget/Services/CatSimilarityGroupingCore.swift"
          grep -Fq 'static let requestRevision = 2' "$core"
          grep -Fq 'options.isNetworkAccessAllowed = false' "$service"
          if grep -REn \
            'VNFeaturePrint|VNGenerateImageFeaturePrintRequest|CatSimilarityCandidate(Group|Instance)' \
            Shared/Sharing NekoWidget/Services/JSONExporter.swift SharingService; then
            echo "FeaturePrint proposal data crossed a sharing/export boundary" >&2
            exit 1
          fi
          if grep -En 'SharedLog\.|JSONEncoder\(|:[[:space:]]*Codable|CatHouseholdIdentityStore\(' \
            "$service"; then
            echo "Similarity service gained persistence or logging authority" >&2
            exit 1
          fi

      - name: Verify read-only cat identity experiment
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Services/CatIdentityExperimentCore.swift \
            NekoWidget/Services/CatIdentityExperimentExporter.swift \
            ci/verify-cat-identity-experiment.swift \
            -o "$RUNNER_TEMP/verify-cat-identity-experiment"
          "$RUNNER_TEMP/verify-cat-identity-experiment"

          service="NekoWidget/Services/CatIdentityExperimentService.swift"
          exporter="NekoWidget/Services/CatIdentityExperimentExporter.swift"
          grep -Fq 'options.isNetworkAccessAllowed = false' "$service"
          grep -Fq 'containsPhotoIdentifiers: false' \
            NekoWidget/Services/CatIdentityExperimentCore.swift
          grep -Fq 'cat-identity-held-out-v3' \
            NekoWidget/Services/CatIdentityExperimentCore.swift
          grep -Fq 'labeledEpisodeIndexByProfile' "$service"
          grep -Fq '撮影日時だけでは停止しません' \
            NekoWidget/Views/CatIdentityExperimentView.swift
          if grep -Fq 'let datedAssets' "$service"; then
            echo "Identity experiment restored the timestamp hard gate" >&2
            exit 1
          fi
          if grep -Fq 'options.isNetworkAccessAllowed = true' "$service"; then
            echo "Identity experiment enabled PhotoKit network access" >&2
            exit 1
          fi
          if grep -En \
            'SharedLog\.|CatHouseholdIdentityStore\(|mutateCatHouseholdIdentity|JSONEncoder\(|:[[:space:]]*Codable' \
            "$service"; then
            echo "Identity experiment service gained write or logging authority" >&2
            exit 1
          fi
          if grep -REn \
            'CatIdentityExperiment|VNGenerateImageFeaturePrintRequest' \
            Shared/Sharing NekoWidget/Services/JSONExporter.swift SharingService; then
            echo "Identity experiment data crossed sharing/export boundaries" >&2
            exit 1
          fi
          grep -Fq 'FileManager.default.temporaryDirectory' "$exporter"
          grep -Fq 'photo.detectedCatCount <= 1' \
            NekoWidget/Views/CatIdentityExperimentView.swift
          grep -Fq 'networkAccessAllowed: false' \
            NekoWidget/Views/CatIdentityExperimentView.swift
          grep -Fq 'CatProfileBoundingBoxSelector.select(' \
            NekoWidget/App/AppRootView.swift
          if grep -Fq 'CatIdentityExperimentView' \
            NekoWidget/Views/SettingsView.swift \
            NekoWidget/Views/CatProfilesView.swift \
            NekoWidget/Views/MainTabView.swift \
            NekoWidget/Views/HomeView.swift \
            NekoWidget/Views/OnboardingView.swift; then
            echo "Retired identity experiment became reachable from product UI" >&2
            exit 1
          fi
          if grep -Fq 'viewModel.catSimilarityCandidateInstances(' \
            NekoWidget/App/AppRootView.swift; then
            echo "Retired identity candidates returned to the daily render path" >&2
            exit 1
          fi

      - name: Verify five-screen onboarding presentation
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            NekoWidget/Views/OnboardingPresentation.swift \
            ci/verify-onboarding-presentation.swift \
            -o "$RUNNER_TEMP/verify-onboarding-presentation"
          "$RUNNER_TEMP/verify-onboarding-presentation"

      - name: Verify real Widget guide screenshots
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          catalog = Path("NekoWidget/Assets.xcassets")
          names = [
              "onboarding-widget-step-1",
              "onboarding-widget-step-2-ios18",
              "onboarding-widget-step-3",
              "onboarding-widget-step-4",
          ]
          for name in names:
              imageset = catalog / f"{name}.imageset"
              png = imageset / f"{name}.png"
              contents = json.loads((imageset / "Contents.json").read_text(encoding="utf-8"))
              filenames = {
                  image.get("filename")
                  for image in contents.get("images", [])
                  if image.get("filename")
              }
              if png.name not in filenames:
                  raise SystemExit(f"{name} is not referenced by its asset catalogue")
              with png.open("rb") as stream:
                  if stream.read(8) != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"{name} is not a PNG")
                  if struct.unpack(">I", stream.read(4))[0] < 8 or stream.read(4) != b"IHDR":
                      raise SystemExit(f"{name} has no valid IHDR")
                  width, height = struct.unpack(">II", stream.read(8))
              if width < 900 or height < 1800 or height <= width:
                  raise SystemExit(f"{name} has unexpected dimensions: {width}x{height}")
              print(f"{name}: {width}x{height}")
          PY

      - name: Resolve fail-closed ordinary Release settings
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          settings_paths=()
          for target in \
            NekoWidget \
            NekoWidgetWidgetExtension \
            NekoWidgetShareExtension; do
            output="$RUNNER_TEMP/${target}ReleaseBuildSettings.json"
            xcodebuild \
              -project NekoWidget.xcodeproj \
              -target "$target" \
              -configuration Release \
              -sdk iphonesimulator \
              -showBuildSettings \
              -json \
              > "$output"
            settings_paths+=("$output")
          done
          python3 ci/validate-disabled-release-build-settings.py \
            "${settings_paths[@]}"

      - name: Build disabled app and extensions for iOS Simulator
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NekoWidget.xcodeproj \
            -scheme NekoWidget \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NekoWidgetBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Upload build result bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-build-result-${{ github.run_id }}
          path: ${{ runner.temp }}/NekoWidgetBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7

  simulator-smoke-test:
    name: Launch app and scan fixtures in Simulator
    needs: build-without-signing
    runs-on: macos-15
    # A cold hosted Simulator can spend several minutes in first-boot data
    # migration. The smoke script itself has bounded waits, so leave enough
    # job time to upload its PASS artifacts instead of cancelling at ~20 min.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # iOS 26.2 accepts `simctl privacy grant photos` without changing
      # PhotoKit's read/write status. Use the stable runtime for app smoke CI.
      SMOKE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run Simulator smoke test
        working-directory: NekoWidget
        shell: bash
        run: bash ci/run-simulator-smoke.sh

      - name: Upload Simulator smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-smoke-artifacts
          if-no-files-found: warn
          retention-days: 7

  sharing-runtime-matrix:
    name: Sharing runtime self-test (iOS 18.5 / 26.2)
    needs: build-without-signing
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run sharing runtime matrix
        working-directory: NekoWidget
        shell: bash
        run: bash ci/run-sharing-runtime-matrix.sh

      - name: Upload sharing runtime matrix artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-sharing-runtime-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-sharing-runtime-matrix
          if-no-files-found: warn
          retention-days: 7
