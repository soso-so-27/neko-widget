name: iOS build check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence-diagnosis:
    name: Read-only evidence diagnosis (not release validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diagnose existing main evidence with job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/reuse-diagnosis"
          cp NekoWidget/ci/{plan-ios-ci.py,ios_ci_scope.py,app_icon_ci.py} "$RUNNER_TEMP/reuse-diagnosis/"
          git checkout --detach 1cbfb989de40cdae292746babd0586572628d108
          python3 "$RUNNER_TEMP/reuse-diagnosis/plan-ios-ci.py" --diagnose-reuse-run 35603862043 --diagnose-scope reviewed-membership-offer-ui-v1
