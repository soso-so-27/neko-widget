name: Launch time probe (diagnostic)
# DIAGNOSTIC ONLY on diagnostic/cat-home-care-launch-*; never merged.
on:
  push:
    branches: ['diagnostic/cat-home-care-launch-*']
    paths: [.github/workflows/launch-probe.yml, NekoWidget/ci/launch-probe.sh]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Quick launch ${{ matrix.app }} ${{ matrix.rep }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [pr979, main]
        rep: [1, 2]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: e4b50714eaf85dae15d7448fc0482f1dbdff9b88
          path: pr
      - name: Fetch existing validated synthetic apps
        run: |
          set -euo pipefail
          fetch() { # label run sha
            test "$(gh api repos/${{ github.repository }}/actions/runs/$2 --jq .head_sha)" = "$3"
            mkdir -p "$RUNNER_TEMP/apps/$1"
            gh run download "$2" -R "${{ github.repository }}" -n quick-launch-app -D "$RUNNER_TEMP/apps/$1"
            tar -xzf "$RUNNER_TEMP/apps/$1/quick-launch-app.tar.gz" -C "$RUNNER_TEMP/apps/$1"
          }
          fetch pr979 43459293614 e4b50714eaf85dae15d7448fc0482f1dbdff9b88
          fetch main 43429005956 e5084aa9c03cade9b160631e31e044b0f9782eb7
      - name: The real Fresh runner launch script on this app
        run: |
          export QUICK_APP_PATH="$RUNNER_TEMP/apps/${{ matrix.app }}/NekoWidget.app"
          bash pr/NekoWidget/ci/run-quick-launch.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: quick-${{ matrix.app }}-${{ matrix.rep }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quick-launch-failure/
            ${{ runner.temp }}/ci-screenshots/
          retention-days: 5
