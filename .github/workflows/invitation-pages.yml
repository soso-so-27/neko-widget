name: Published invitation pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/privacy/**'
      - 'docs/support/**'
      - 'docs/community/**'
      - 'docs/join.html'
      - 'docs/family-join.html'
      - 'docs/assets/site.css'
      - 'docs/.well-known/apple-app-site-association'
      - 'NekoWidget/SharingService/scripts/*invitation*.mjs'
      - '.github/workflows/invitation-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: node NekoWidget/SharingService/scripts/check-invitation-deployment.mjs
