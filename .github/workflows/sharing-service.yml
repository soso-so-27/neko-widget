name: Sharing service check

on:
  push:
    paths:
      - "NekoWidget/SharingService/**"
      - "NekoWidget/BillingVerificationService/**"
      - "NekoWidget/ci/fixtures/billing-verifier-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-api-v1-responses.json"
      - "NekoWidget/ci/fixtures/sharing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/sharing-api-v1-responses.json"
      - ".github/workflows/sharing-service.yml"
      - ".github/workflows/sharing-staging-monitor.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "NekoWidget/SharingService/**"
      - "NekoWidget/BillingVerificationService/**"
      - "NekoWidget/ci/fixtures/billing-verifier-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-api-v1-responses.json"
      - "NekoWidget/ci/fixtures/sharing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/sharing-api-v1-responses.json"
      - ".github/workflows/sharing-service.yml"
      - ".github/workflows/sharing-staging-monitor.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharing-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-verifier-check:
    name: Typecheck, test, and build Apple transaction verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NekoWidget/BillingVerificationService/package-lock.json

      - name: Install locked dependencies
        working-directory: NekoWidget/BillingVerificationService
        shell: bash
        run: npm ci --ignore-scripts

      - name: Verify Apple transaction service boundary
        working-directory: NekoWidget/BillingVerificationService
        shell: bash
        run: npm run check

  moderation-keygen-windows-policy:
    name: Windows moderation key, drill, and report policy fixtures
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Parse and exercise Windows path, volume, and ACL policy
        working-directory: NekoWidget/SharingService
        shell: powershell
        run: |
          $files = @(
            "scripts/moderation-staging-keygen-windows.ps1",
            "scripts/moderation-staging-keygen-windows-security.ps1",
            "scripts/moderation-staging-drill-windows.ps1",
            "scripts/moderation-staging-drill-review-windows.ps1",
            "scripts/moderation-windows-trusted-node.ps1",
            "scripts/moderation-report-tool-windows.ps1",
            "scripts/personal-staging-emergency-off-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failed" }
          }
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $result = & $windowsPowerShell `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\moderation-staging-keygen-windows-security.ps1 `
            -PolicySelfTest
          if ($LASTEXITCODE -ne 0 -or
              $result -ne "NEKO_MODERATION_KEYGEN_WINDOWS_POLICY_SELFTEST_V1") {
            throw "Windows policy self-test failed"
          }
          $emergencyOffPolicy = & $windowsPowerShell `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\personal-staging-emergency-off-windows.ps1 `
            -PolicySelfTest
          if ($LASTEXITCODE -ne 0 -or
              $emergencyOffPolicy -ne "NEKO_PERSONAL_STAGING_EMERGENCY_OFF_POLICY_SELFTEST_V2") {
            throw "Emergency OFF policy self-test failed"
          }
          npm run check:moderation-keygen
          npm run check:moderation-drill
          npm run check:moderation-tool

  check:
    name: Typecheck, test, and bundle Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NekoWidget/SharingService/package-lock.json

      - name: Install locked dependencies
        working-directory: NekoWidget/SharingService
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run Worker, D1, staging, moderation, and key ceremony tests
        working-directory: NekoWidget/SharingService
        shell: bash
        run: npm run check

      - name: Build deployment bundle without publishing
        working-directory: NekoWidget/SharingService
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy \
            --dry-run \
            --config wrangler.jsonc \
            --outdir "$RUNNER_TEMP/neko-sharing-worker"
          test -n "$(find "$RUNNER_TEMP/neko-sharing-worker" -type f -print -quit)"
          npx --no-install wrangler deploy \
            --dry-run \
            --config wrangler.moderation-operator.disabled.jsonc \
            --outdir "$RUNNER_TEMP/neko-moderation-operator-disabled" \
            --autoconfig=false \
            --experimental-provision=false \
            --experimental-auto-create=false
          test -n "$(find "$RUNNER_TEMP/neko-moderation-operator-disabled" -type f -print -quit)"
