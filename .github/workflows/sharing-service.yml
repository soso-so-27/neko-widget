name: Sharing service check

on:
  push:
    paths:
      - "NekoWidget/SharingService/**"
      - "NekoWidget/ci/fixtures/pairing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-api-v1-responses.json"
      - "NekoWidget/ci/fixtures/sharing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/sharing-api-v1-responses.json"
      - ".github/workflows/sharing-service.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "NekoWidget/SharingService/**"
      - "NekoWidget/ci/fixtures/pairing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/pairing-api-v1-responses.json"
      - "NekoWidget/ci/fixtures/sharing-protocol-v1.json"
      - "NekoWidget/ci/fixtures/sharing-api-v1-responses.json"
      - ".github/workflows/sharing-service.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharing-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moderation-keygen-windows-policy:
    name: Windows moderation key and drill policy fixtures
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Parse and exercise Windows path, volume, and ACL policy
        working-directory: NekoWidget/SharingService
        shell: powershell
        run: |
          $files = @(
            "scripts/moderation-staging-keygen-windows.ps1",
            "scripts/moderation-staging-keygen-windows-security.ps1",
            "scripts/moderation-staging-drill-windows.ps1",
            "scripts/moderation-staging-drill-review-windows.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failed" }
          }
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $result = & $windowsPowerShell `
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\scripts\moderation-staging-keygen-windows-security.ps1 `
            -PolicySelfTest
          if ($LASTEXITCODE -ne 0 -or
              $result -ne "NEKO_MODERATION_KEYGEN_WINDOWS_POLICY_SELFTEST_V1") {
            throw "Windows policy self-test failed"
          }
          npm run check:moderation-keygen
          npm run check:moderation-drill

  check:
    name: Typecheck, test, and bundle Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NekoWidget/SharingService/package-lock.json

      - name: Install locked dependencies
        working-directory: NekoWidget/SharingService
        shell: bash
        run: npm ci --ignore-scripts

      - name: Typecheck Worker
        working-directory: NekoWidget/SharingService
        shell: bash
        run: npm run typecheck

      - name: Run Worker, D1, staging, moderation, and key ceremony tests
        working-directory: NekoWidget/SharingService
        shell: bash
        run: npm run check:staging-config && npm run check:moderation-tool && npm run check:moderation-keygen && npm run check:moderation-drill && npm test

      - name: Build deployment bundle without publishing
        working-directory: NekoWidget/SharingService
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy \
            --dry-run \
            --config wrangler.jsonc \
            --outdir "$RUNNER_TEMP/neko-sharing-worker"
          test -n "$(find "$RUNNER_TEMP/neko-sharing-worker" -type f -print -quit)"
