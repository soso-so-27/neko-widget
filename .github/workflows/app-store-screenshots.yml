name: Capture privacy-safe App Store screenshots

on:
  workflow_dispatch:
    inputs:
      review_test:
        description: "対象のtestReviewメソッド。空欄は1.0のApp Store用7枚"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: app-store-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-local-only-iphone:
    name: Capture offline Japanese 1.0 iPhone set
    if: inputs.review_test == ''
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CAPTURE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Prepare the erased Simulator and build the offline capture app
        timeout-minutes: 25
        working-directory: NekoWidget
        shell: bash
        run: |
          set -Eeuo pipefail

          artifact_directory="$RUNNER_TEMP/neko-app-store-screenshots"
          derived_data_directory="$RUNNER_TEMP/NekoAppStoreScreenshotDerivedData"
          result_bundle="$artifact_directory/AppStoreScreenshots.xcresult"
          mkdir -p "$artifact_directory"

          xcodebuild -version | tee "$artifact_directory/xcode-version.txt"
          widget_conditions() {
            local configuration="$1"
            local fixture_condition="$2"
            xcodebuild \
              -project NekoWidget.xcodeproj \
              -target NekoWidgetWidgetExtension \
              -configuration "$configuration" \
              -sdk iphonesimulator \
              -showBuildSettings \
              "WIDGET_SCREENSHOT_FIXTURE_CONDITION=$fixture_condition" \
              2>/dev/null \
              | awk -F ' = ' \
                  '/^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = / {print $2; exit}'
          }
          capture_conditions="$(widget_conditions Debug APP_STORE_SCREENSHOT_WIDGET_FIXTURE)"
          ordinary_debug_conditions="$(widget_conditions Debug '')"
          release_conditions="$(widget_conditions Release APP_STORE_SCREENSHOT_WIDGET_FIXTURE)"
          printf 'capture-debug=%s\nordinary-debug=%s\nrelease=%s\n' \
            "$capture_conditions" "$ordinary_debug_conditions" "$release_conditions" \
            | tee "$artifact_directory/widget-fixture-build-conditions.txt"
          if [[ " $capture_conditions " != *" DEBUG "* \
                || " $capture_conditions " != *" APP_STORE_SCREENSHOT_WIDGET_FIXTURE "* ]]; then
            echo "The capture Widget target is missing its dual compiler guard." >&2
            exit 1
          fi
          if [[ " $ordinary_debug_conditions " == *" APP_STORE_SCREENSHOT_WIDGET_FIXTURE "* \
                || " $release_conditions " == *" APP_STORE_SCREENSHOT_WIDGET_FIXTURE "* ]]; then
            echo "The screenshot fixture leaked outside the dedicated capture Debug target." >&2
            exit 1
          fi
          xcrun simctl list devices available --json \
            > "$artifact_directory/available-simulators.json"

          python3 - \
            "$artifact_directory/available-simulators.json" \
            "$artifact_directory/selected-simulator.tsv" \
            "$CAPTURE_IOS_RUNTIME" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          runtime = sys.argv[3]
          devices = json.loads(source.read_text(encoding="utf-8"))["devices"]
          available = [
              device
              for device in devices.get(runtime, [])
              if device.get("isAvailable", False)
          ]
          # Every name below is in Apple's 6.9-inch screenshot class. The
          # exporter still rejects the result unless its pixels are one of the
          # currently accepted portrait sizes.
          preferred_names = [
              "iPhone 17 Pro Max",
              "iPhone 16 Pro Max",
              "iPhone 16 Plus",
              "iPhone 15 Pro Max",
              "iPhone 15 Plus",
              "iPhone 14 Pro Max",
          ]
          selected = next(
              (
                  device
                  for name in preferred_names
                  for device in available
                  if device.get("name") == name
              ),
              None,
          )
          if selected is None:
              names = ", ".join(sorted(str(item.get("name")) for item in available))
              raise SystemExit(
                  f"No available 6.9-inch iPhone for {runtime}. Available: {names or '(none)'}"
              )
          destination.write_text(
              f"{selected['udid']}\t{selected['name']}\t{runtime}\n",
              encoding="utf-8",
          )
          PY

          IFS=$'\t' read -r simulator_udid simulator_name simulator_runtime \
            < "$artifact_directory/selected-simulator.tsv"
          if [[ -z "$simulator_udid" || -z "$simulator_name" || -z "$simulator_runtime" ]]; then
            echo "The selected Simulator record is incomplete." >&2
            exit 1
          fi
          printf 'Selected Simulator: %s (%s, %s)\n' \
            "$simulator_name" "$simulator_runtime" "$simulator_udid" \
            | tee "$artifact_directory/selected-simulator.txt"

          # Erasure before and after capture is the account/photo isolation
          # boundary. No media is imported; fixture pixels are drawn by DEBUG
          # code and are excluded from Release archives.
          xcrun simctl shutdown "$simulator_udid" || true
          xcrun simctl erase "$simulator_udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl spawn "$simulator_udid" defaults write NSGlobalDomain \
            AppleLanguages -array ja-JP
          xcrun simctl spawn "$simulator_udid" defaults write NSGlobalDomain \
            AppleLocale ja_JP
          xcrun simctl shutdown "$simulator_udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl ui "$simulator_udid" appearance light
          if ! xcrun simctl status_bar "$simulator_udid" override \
              --time 09:41 \
              --batteryLevel 100 \
              --batteryState charged \
              --wifiBars 3 \
              --cellularBars 4; then
            # Older simctl variants accept the stable fields but not the bar
            # count flags. Time and battery are the reproducibility boundary.
            xcrun simctl status_bar "$simulator_udid" override \
              --time 09:41 \
              --batteryLevel 100 \
              --batteryState charged
          fi

          xcodebuild \
            -project NekoWidget.xcodeproj \
            -scheme NekoWidget \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$derived_data_directory" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            WIDGET_SCREENSHOT_FIXTURE_CONDITION=APP_STORE_SCREENSHOT_WIDGET_FIXTURE \
            SHARING_RELEASE_MODE=production \
            GROUP_WINDOWS_ENABLED=YES \
            OFFICIAL_WINDOW_FEED_URL= \
            MANAGED_PRESERVATION_ORIGIN= \
            MANAGED_PRESERVATION_ENABLED=NO \
            PLUS_BILLING_API_BASE_URL= \
            PLUS_BILLING_CLIENT_ENABLED=NO \
            PLUS_STOREFRONT_ENABLED=NO \
            PERSONAL_ARCHIVE_ENABLED=NO \
            SHARING_FEATURE_ENABLED=NO \
            SHARING_MEDIA_ENABLED=NO \
            SHARING_SHARE_EXTENSION_HANDOFF_ENABLED=NO \
            SHARING_SHARE_EXTENSION_SEND_ENABLED=NO \
            SHARING_REVIEW_PREVIEW_ENABLED=NO \
            SHARING_API_BASE_URL= \
            SHARING_MODERATION_KEY_ID= \
            SHARING_MODERATION_PUBLIC_KEY= \
            SHARING_PRIVACY_URL= \
            SHARING_SUPPORT_URL= \
            SHARING_COMMUNITY_STANDARDS_URL= \
            APP_PRIVACY_URL= \
            APP_SUPPORT_URL= \
            SHARE_EXTENSION_INFOPLIST_FILE=NekoWidgetShareExtension/Info.Disabled.plist \
            build-for-testing 2>&1 | tee "$artifact_directory/xcodebuild-test.log"
          python3 - "$derived_data_directory/Build/Products/Debug-iphonesimulator/NekoWidget.app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as file:
              info = plistlib.load(file)
          required = {"SharingReleaseMode": "production", "GroupWindowsEnabled": "YES",
                      "SharingFeatureEnabled": "NO", "SharingMediaEnabled": "NO"}
          for key, value in required.items():
              if info.get(key) != value:
                  raise SystemExit(f"Capture build has unexpected {key}")
          for key in ("SharingAPIBaseURL", "PlusBillingAPIBaseURL", "OfficialWindowFeedURL",
                      "ManagedPreservationOrigin", "SharingModerationPublicKey"):
              if info.get(key):
                  raise SystemExit(f"Capture build unexpectedly configured {key}")
          PY
      - name: Capture the three UI tests on the prepared Simulator
        timeout-minutes: 12
        working-directory: NekoWidget
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_directory="$RUNNER_TEMP/neko-app-store-screenshots"
          derived_data_directory="$RUNNER_TEMP/NekoAppStoreScreenshotDerivedData"
          result_bundle="$artifact_directory/AppStoreScreenshots.xcresult"
          IFS=$'\t' read -r simulator_udid simulator_name simulator_runtime < "$artifact_directory/selected-simulator.tsv"
          test_run=$(find "$derived_data_directory/Build/Products" -maxdepth 1 -name '*.xctestrun' -print)
          [[ -n "$test_run" && $(printf '%s\n' "$test_run" | wc -l | tr -d ' ') == 1 ]]
          set +e
          xcodebuild test-without-building -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -resultBundlePath "$result_bundle" \
            -only-testing:NekoWidgetUITests/AppStoreScreenshotUITests/testCaptureVersion1ProductScreens \
            -only-testing:NekoWidgetUITests/AppStoreScreenshotUITests/testCaptureVersion1WindowScreens \
            -only-testing:NekoWidgetUITests/WidgetPlacementScreenshotUITests/testCaptureJapaneseLocalOnlyWidgetPreviewForAppStore \
            -parallel-testing-enabled NO \
            -testLanguage ja \
            -testRegion JP \
            2>&1 | tee -a "$artifact_directory/xcodebuild-test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$test_status" > "$artifact_directory/test-exit-code.txt"
          exit "$test_status"

      - name: Erase the capture simulator after testing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/neko-app-store-screenshots/selected-simulator.tsv"
          if [[ -s "$record" ]]; then
            IFS=$'\t' read -r simulator_udid simulator_name simulator_runtime < "$record"
            xcrun simctl shutdown "$simulator_udid" || true
            xcrun simctl erase "$simulator_udid"
          fi

      - name: Export accepted-size JPEGs without metadata
        working-directory: NekoWidget
        shell: bash
        run: |
          set -Eeuo pipefail
          result_bundle="$RUNNER_TEMP/neko-app-store-screenshots/AppStoreScreenshots.xcresult"
          output_directory="$RUNNER_TEMP/neko-app-store-screenshots/exported"
          bash ci/export-app-store-screenshots.sh \
            "$result_bundle" "$output_directory"
          cp "$RUNNER_TEMP/neko-app-store-screenshots/selected-simulator.txt" \
            "$output_directory/capture-device.txt"
          xcodebuild -version > "$output_directory/xcode-version.txt"
          cp "$RUNNER_TEMP/neko-app-store-screenshots/widget-fixture-build-conditions.txt" \
            "$output_directory/widget-fixture-build-conditions.txt"

      - name: Upload review-ready candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-store-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-app-store-screenshots/exported
          if-no-files-found: error
          retention-days: 14

      - name: Export named capture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_directory="$RUNNER_TEMP/neko-app-store-screenshots"
          result_bundle="$artifact_directory/AppStoreScreenshots.xcresult"
          output_directory="$artifact_directory/failure-attachments"
          export_log="$artifact_directory/failure-xcresulttool-export.log"
          mkdir -p "$artifact_directory"
          if [[ -d "$result_bundle" ]]; then
            mkdir -p "$output_directory"
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$output_directory" \
              > "$export_log" 2>&1
          else
            printf '%s\n' "Result bundle was not created." > "$export_log"
          fi

      - name: Upload capture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app-store-screenshot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neko-app-store-screenshots/xcodebuild-test.log
            ${{ runner.temp }}/neko-app-store-screenshots/test-exit-code.txt
            ${{ runner.temp }}/neko-app-store-screenshots/selected-simulator.txt
            ${{ runner.temp }}/neko-app-store-screenshots/xcode-version.txt
            ${{ runner.temp }}/neko-app-store-screenshots/widget-fixture-build-conditions.txt
            ${{ runner.temp }}/neko-app-store-screenshots/failure-attachments
            ${{ runner.temp }}/neko-app-store-screenshots/failure-xcresulttool-export.log
          if-no-files-found: error
          retention-days: 7

  capture-review:
    name: Capture changed screens
    if: inputs.review_test != '' && inputs.review_test != 'testReviewPublicIPadCompatibility' && inputs.review_test != 'probePublicIPadSettings'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      REVIEW_TEST: ${{ inputs.review_test }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run the targeted screen check
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_TEST" =~ ^testReview[A-Za-z0-9_]+$ ]]
          grep -Fq "func ${REVIEW_TEST}(" NekoWidgetUITests/AppStoreScreenshotUITests.swift
          runtime=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"]
                     if r.get("isAvailable") and r.get("version") == "26.2" and ".iOS-" in r["identifier"]))
          ')
          device=$(xcrun simctl create NekoUIReview com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true; xcrun simctl delete "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project NekoWidget.xcodeproj -scheme NekoWidget \
            -configuration Debug -xcconfig Config.Disabled.xcconfig \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/ReviewBuild" \
            -resultBundlePath "$RUNNER_TEMP/UIReview.xcresult" \
            "-only-testing:NekoWidgetUITests/AppStoreScreenshotUITests/$REVIEW_TEST" \
            -parallel-testing-enabled NO -testLanguage ja -testRegion JP \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES test
      - name: Export the captured screens
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/UIReview.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UIReview.xcresult" \
              --output-path "$RUNNER_TEMP/ui-review-screenshots"
          fi
      - name: Attach screenshots for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-review-screenshots
          path: ${{ runner.temp }}/ui-review-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14

  capture-public-ipad:
    name: One public Release iPad compatibility walk-through
    if: inputs.review_test == 'testReviewPublicIPadCompatibility'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact requested source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve iPad destination before compiling
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/ipad-runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/ipad-types.json"
          readarray_compat=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          runtimes = json.loads((root / 'ipad-runtimes.json').read_text())['runtimes']
          runtime = next(r['identifier'] for r in runtimes
                         if r.get('isAvailable') and r.get('version') == '26.2' and '.iOS-' in r['identifier'])
          kinds = [d for d in json.loads((root / 'ipad-types.json').read_text())['devicetypes']
                   if d['name'].startswith('iPad')]
          kind = next((d for d in kinds if d['name'] == 'iPad (A16)'), kinds[0])
          print(runtime)
          print(kind['identifier'])
          print(kind['name'])
          PY
          )
          runtime=$(printf '%s\n' "$readarray_compat" | sed -n '1p')
          kind=$(printf '%s\n' "$readarray_compat" | sed -n '2p')
          device=$(xcrun simctl create NekoPublicIPad "$kind" "$runtime")
          printf 'IPAD_DEVICE=%s\n' "$device" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$readarray_compat" "$device" > "$RUNNER_TEMP/ipad-destination.txt"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance light
          xcodebuild -project NekoWidget.xcodeproj -scheme NekoWidget -showdestinations \
            > "$RUNNER_TEMP/ipad-available-destinations.txt"
          python3 - "$device" <<'PY'
          import os, sys
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'ipad-available-destinations.txt').read_text()
          available = text.split('Ineligible destinations')[0]
          if sys.argv[1] not in available:
              raise SystemExit('iPad is not an available destination; do not change device family or build.')
          PY
      - name: Build the public Release boundary once
        timeout-minutes: 25
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/production_candidate.py fixture --synthetic --contract "$RUNNER_TEMP/ipad-contract.json"
          python3 ci/production_candidate.py build --synthetic --contract "$RUNNER_TEMP/ipad-contract.json" -- \
            build-for-testing -sdk iphonesimulator -enableCodeCoverage NO \
            -destination "platform=iOS Simulator,id=$IPAD_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/PublicIPadBuild" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile \
            2>&1 | tee "$RUNNER_TEMP/ipad-public-build.log"
          app="$RUNNER_TEMP/PublicIPadBuild/Build/Products/Release-iphonesimulator/NekoWidget.app"
          python3 ci/production_candidate.py products --synthetic \
            --contract "$RUNNER_TEMP/ipad-contract.json" --path "$app"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as file:
              info = plistlib.load(file)
          if info.get('UIDeviceFamily') != [1]:
              raise SystemExit('This must remain the iPhone-only product in iPad compatibility mode.')
          print('Release iPhone-only app:', info.get('DTXcode'), info.get('DTSDKName'), info['UIDeviceFamily'])
          PY
          xcrun simctl install "$IPAD_DEVICE" "$app"
          xcrun simctl addmedia "$IPAD_DEVICE" \
            ci/fixtures/cats/cat-orange-square.png \
            ci/fixtures/cats/cat-tuxedo-landscape.png \
            ci/fixtures/cats/cat-gray-portrait.png
          # Exercise the visible Photos permission prompt in the public walk-through.
          # test-without-building installs the app again; do not rely on a pre-grant.
      - name: Walk through the five public screens once
        timeout-minutes: 7
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          test_run=$(find "$RUNNER_TEMP/PublicIPadBuild/Build/Products" -maxdepth 1 -name '*.xctestrun' -print)
          [[ -n "$test_run" && $(printf '%s\n' "$test_run" | wc -l | tr -d ' ') == 1 ]]
          xcodebuild test-without-building -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=$IPAD_DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/PublicIPad.xcresult" \
            -only-testing:NekoWidgetUITests/AppStoreScreenshotUITests/testReviewPublicIPadCompatibility \
            -parallel-testing-enabled NO -testLanguage ja -testRegion JP \
            2>&1 | tee "$RUNNER_TEMP/ipad-public-test.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'ipad-public-test.log').read_text()
          cases = re.findall(r"Test Case '-\[([^\]]+)\]' (started|passed|failed|skipped)", text)
          expected = 'NekoWidgetUITests.AppStoreScreenshotUITests testReviewPublicIPadCompatibility'
          if cases != [(expected, 'started'), (expected, 'passed')]:
              raise SystemExit('Exactly one public iPad walk-through must run and pass; no skipped/retried test.')
          PY
      - name: Export screenshots even on failure
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/PublicIPad.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PublicIPad.xcresult" \
              --output-path "$RUNNER_TEMP/ipad-public-screenshots"
          fi
      - name: Attach screenshots and native result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-ipad-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PublicIPad.xcresult
            ${{ runner.temp }}/ipad-public-screenshots
            ${{ runner.temp }}/ipad-public-build.log
            ${{ runner.temp }}/ipad-public-test.log
            ${{ runner.temp }}/ipad-destination.txt
            ${{ runner.temp }}/ipad-available-destinations.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Dispose of the ephemeral simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${IPAD_DEVICE:-}" ]]; then
            xcrun simctl shutdown "$IPAD_DEVICE" || true
            xcrun simctl delete "$IPAD_DEVICE" || true
          fi

  probe-public-ipad:
    name: Read public Simulator build settings only (no compilation or UI)
    if: inputs.review_test == 'probePublicIPadSettings'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare settings probe with and without the coverage argument
        working-directory: NekoWidget
        run: python3 ci/probe-public-ipad-settings.py
      - name: Preserve the direct probe output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-ipad-settings-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ipad-settings-probe.txt
          retention-days: 7
          if-no-files-found: warn
