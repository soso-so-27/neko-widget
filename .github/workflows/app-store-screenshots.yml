name: Isolated group protocol prototype
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [probe, widget]
        default: probe
permissions:
  contents: read
jobs:
  protocol-probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run actual CryptoKit HPKE
        run: |
          swiftc -parse-as-library -D PROTOTYPE_CLI experiments/group-prototype/HPKE.swift -o "$RUNNER_TEMP/hpke-probe"
          "$RUNNER_TEMP/hpke-probe"
      - name: Run actual OpenMLS and build iOS libraries
        working-directory: experiments/group-prototype/openmls
        run: |
          rustup update stable --no-self-update
          rustup target add --toolchain stable aarch64-apple-ios aarch64-apple-ios-sim
          cargo +stable run --example run
          cargo +stable build --target aarch64-apple-ios
          cargo +stable build --target aarch64-apple-ios-sim
      - name: Check HPKE against the iOS 17 SDK availability boundary
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -parse-as-library -emit-object -target arm64-apple-ios17.0-simulator -sdk "$SDK" experiments/group-prototype/HPKE.swift -o "$RUNNER_TEMP/hpke-ios.o"
