name: 1118f focused Swift
on:
  push:
    branches: ['diagnostic/1118f-swift']
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 7
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check owner and public configuration plus updated Swift syntax
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -D INTERNAL_PRESENTATION -parse-as-library \
            NekoWidget/Shared/Sharing/SharingAPIConfiguration.swift \
            NekoWidget/ci/verify-production-configuration.swift \
            -o "$RUNNER_TEMP/test-two-device"
          "$RUNNER_TEMP/test-two-device"
          xcrun swiftc -D INTERNAL_PRESENTATION -D NEKO_SHARE_EXTENSION -parse-as-library \
            -typecheck NekoWidget/Shared/Sharing/SharingAPIConfiguration.swift
          git diff --name-only HEAD^ HEAD -- 'NekoWidget/*.swift' \
            | while read -r source; do
                xcrun swiftc -frontend -parse -D INTERNAL_PRESENTATION \
                  -target arm64-apple-ios17.1 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" "$source"
              done
      - name: Verify the changed recovery client and internal boundaries
        working-directory: NekoWidget
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/test-root-sync-boundary.py
          python3 ci/test-group-recovery-screens.py
          bash ci/run-group-recovery-client-checks.sh
      - name: Inspect the compiled public and share configuration binaries
        shell: bash
        run: |
          set -euo pipefail
          source=NekoWidget/Shared/Sharing/SharingAPIConfiguration.swift
          xcrun swiftc -O -emit-library "$source" -o "$RUNNER_TEMP/public.dylib"
          xcrun swiftc -O -D INTERNAL_PRESENTATION -D NEKO_SHARE_EXTENSION -emit-library "$source" -o "$RUNNER_TEMP/share.dylib"
          strings "$RUNNER_TEMP/public.dylib" > "$RUNNER_TEMP/public-strings.txt"
          strings "$RUNNER_TEMP/share.dylib" > "$RUNNER_TEMP/share-strings.txt"
          ! grep -E 'workers\.dev|Neko-Owner-Trial-Proof|OwnerTwoDeviceTrial' "$RUNNER_TEMP/public-strings.txt"
          ! grep -E 'Neko-Owner-Trial-Proof|OwnerTwoDeviceTrial' "$RUNNER_TEMP/share-strings.txt"
