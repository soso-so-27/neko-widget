name: Preservation image validator check

on:
  push:
    branches-ignore:
      - "diagnostic/**"
    paths:
      - "NekoWidget/PreservationImageValidator/**"
      - ".github/workflows/preservation-image-validator.yml"
  pull_request:
    paths:
      - "NekoWidget/PreservationImageValidator/**"
      - ".github/workflows/preservation-image-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preservation-image-validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preservation JPEG provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: NekoWidget/PreservationImageValidator/package-lock.json
      - name: Install locked dependencies
        working-directory: NekoWidget/PreservationImageValidator
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck and validate actual JPEG decoding and resource boundaries
        working-directory: NekoWidget/PreservationImageValidator
        run: npm test
      - name: Bundle the disabled private Container gateway without deployment
        working-directory: NekoWidget/PreservationImageValidator
        run: npx wrangler deploy --dry-run --containers-rollout=none --config wrangler.container.disabled.jsonc
      - name: Build the linux amd64 decoder image without deployment
        working-directory: NekoWidget/PreservationImageValidator
        run: docker build --pull --platform linux/amd64 -t neko-preservation-validator-ci:local .
      - name: Run synthetic JPEG and caller-boundary checks inside the image
        working-directory: NekoWidget/PreservationImageValidator
        run: |
          docker run --rm -d --name neko-preservation-validator-ci -p 127.0.0.1:18080:8080 \
            -e JPEG_VALIDATOR_ENABLED=YES \
            -e JPEG_VALIDATOR_CALLER_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            neko-preservation-validator-ci:local
          trap 'docker stop neko-preservation-validator-ci' EXIT
          node test/container-probe.mjs
      # This is neither native iOS release evidence nor a deployment.
