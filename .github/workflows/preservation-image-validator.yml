name: Preservation image validator check

on:
  push:
    branches-ignore:
      - "diagnostic/**"
    paths:
      - "NekoWidget/PreservationImageValidator/**"
      - ".github/workflows/preservation-image-validator.yml"
  pull_request:
    paths:
      - "NekoWidget/PreservationImageValidator/**"
      - ".github/workflows/preservation-image-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preservation-image-validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate preservation JPEG provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: NekoWidget/PreservationImageValidator/package-lock.json
      - name: Install locked dependencies
        working-directory: NekoWidget/PreservationImageValidator
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck and validate actual JPEG decoding and resource boundaries
        working-directory: NekoWidget/PreservationImageValidator
        run: npm test
      - name: Bundle the disabled private Container gateway without deployment
        working-directory: NekoWidget/PreservationImageValidator
        run: npx wrangler deploy --dry-run --containers-rollout=none --config wrangler.container.disabled.jsonc
      - name: Build the linux amd64 decoder image without deployment
        working-directory: NekoWidget/PreservationImageValidator
        run: docker build --pull --platform linux/amd64 -t neko-preservation-validator-ci:local .
      - name: Run synthetic JPEG and caller-boundary checks inside the image
        working-directory: NekoWidget/PreservationImageValidator
        run: |
          docker run --rm -d --name neko-preservation-validator-ci -p 127.0.0.1:18080:8080 \
            -e JPEG_VALIDATOR_ENABLED=YES \
            -e JPEG_VALIDATOR_CALLER_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            neko-preservation-validator-ci:local
          trap 'docker stop neko-preservation-validator-ci' EXIT
          node test/container-probe.mjs
      - name: Export the validated linux amd64 image and provenance
        working-directory: NekoWidget/PreservationImageValidator
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker image inspect --format '{{.Id}}' neko-preservation-validator-ci:local > image-artifact/image-id.txt
          docker image inspect --format '{{.Os}}/{{.Architecture}}' neko-preservation-validator-ci:local > image-artifact/platform.txt
          test "$(cat image-artifact/platform.txt)" = "linux/amd64"
          docker save neko-preservation-validator-ci:local | gzip -n > image-artifact/image.tar.gz
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('image-artifact')
          archive = root / 'image.tar.gz'
          with archive.open('rb') as stream:
              checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
          record = {'sourceCommit': os.environ['GITHUB_SHA'],
                    'owningRunId': os.environ['GITHUB_RUN_ID'],
                    'owningRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'repository': os.environ['GITHUB_REPOSITORY'],
                    'imageId': (root / 'image-id.txt').read_text().strip(),
                    'platform': (root / 'platform.txt').read_text().strip(),
                    'archive': archive.name, 'archiveSHA256': checksum,
                    'validatedBy': 'all preceding Node and image probe steps',
                    'deploymentPerformed': False}
          (root / 'provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Save the validated image for private deployment preparation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: preservation-jpeg-image-${{ github.sha }}
          path: NekoWidget/PreservationImageValidator/image-artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      # This is neither native iOS release evidence nor a deployment.
