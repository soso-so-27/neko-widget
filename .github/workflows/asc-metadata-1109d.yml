name: Apply approved App Store metadata 1109d
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Owner-approved 1109d fields only; dry-run before apply
        default: dry-run
        required: true
        type: choice
        options: [dry-run, apply]
      scope:
        description: Approved groups or one explicitly approved description scope
        default: approved-groups
        required: true
        type: choice
        options: [approved-groups, version-description, daily-photo-app-description, daily-photo-plus-description]
permissions:
  contents: read
jobs:
  read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: asc-metadata
    timeout-minutes: 12
    env:
      ASC_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install pinned asc and verify telemetry is disabled
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]]
          expected=886d004a33e24558769ffd95f937297aa1413fec145667fae888817b491726e4
          mkdir -p "$RUNNER_TEMP/asc-bin"
          curl --fail --silent --show-error --location "https://github.com/rorkai/App-Store-Connect-CLI/releases/download/6.5.3/asc_6.5.3_linux_amd64" -o "$RUNNER_TEMP/asc-bin/asc"
          echo "$expected  $RUNNER_TEMP/asc-bin/asc" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/asc-bin/asc"
          echo "$RUNNER_TEMP/asc-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/asc-bin/asc" version
          "$RUNNER_TEMP/asc-bin/asc" telemetry status
      - name: Plan or apply only the approved fields
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ASC_MODE: ${{ inputs.mode }}
          ASC_METADATA_SCOPE: ${{ inputs.scope }}
        run: node NekoWidget/ci/asc-metadata-apply.mjs "--$ASC_MODE"
      - name: Read remaining readiness findings
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: node NekoWidget/ci/asc-metadata-apply.mjs --validate
