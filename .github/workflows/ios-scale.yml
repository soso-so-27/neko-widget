name: iOS Simulator scale test

on:
  workflow_dispatch:
    inputs:
      photo_count:
        description: Number of generated photos to import and scan
        required: true
        default: "1000"
        type: choice
        options:
          - "1000"
          - "2000"
          - "3000"
      pet_identity_probe:
        description: Run the isolated synthetic pet-model probe instead of the photo scale test
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator-scale-test:
    if: ${{ !inputs.pet_identity_probe }}
    name: Scan ${{ inputs.photo_count }} photos in Simulator
    runs-on: macos-15
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SMOKE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
      SIMULATOR_TEST_MODE: scale
      SCALE_PHOTO_COUNT: ${{ inputs.photo_count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run Simulator scale test
        working-directory: NekoWidget
        shell: bash
        timeout-minutes: 350
        run: bash ci/run-simulator-smoke.sh

      - name: Upload Simulator scale-test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-scale-${{ inputs.photo_count }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-scale-artifacts
          if-no-files-found: warn
          retention-days: 7

  pet-identity-probe:
    if: ${{ inputs.pet_identity_probe }}
    name: Isolated pet-model build and synthetic probe (not device performance)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Build and run the isolated probe
        run: bash experiments/PetIdentityProbe/run-ci.sh
      - name: Keep small probe evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pet-identity-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/pet-identity-evidence
          if-no-files-found: warn
          retention-days: 3
