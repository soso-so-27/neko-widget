name: iOS focused UI diagnostic
run-name: "Read existing Photos failure diagnostics: ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact one-off existing-xcresult reader commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: membership-existing-xcresult-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic only - read retained Photos xcresult
    runs-on: macos-15
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NEKO_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Validate one-off identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          if (os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
              or os.environ.get('GITHUB_REF') != 'refs/heads/diagnostic/automatic-membership-existing-xcresult-20261016'
              or os.environ.get('GITHUB_RUN_ATTEMPT') != '1'
              or re.fullmatch(r'[0-9a-f]{40}', os.environ['NEKO_DIAGNOSTIC_SOURCE_SHA']) is None
              or os.environ['NEKO_DIAGNOSTIC_SOURCE_SHA'] != os.environ['GITHUB_SHA']):
              raise SystemExit('Exact source/ref/attempt required; this is not release evidence')
          PY
      - name: Check out exact reader
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Export existing failure diagnostics without tests
        working-directory: NekoWidget
        env:
          GH_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: python3 ci/inspect-photo-xcresult.py
      - name: Upload selected diagnostics only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: existing-xcresult-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-existing-xcresult-evidence
          if-no-files-found: warn
          retention-days: 7
