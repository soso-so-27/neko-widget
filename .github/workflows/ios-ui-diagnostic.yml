name: iOS focused UI diagnostic
run-name: "Foundation queue boundary: ${{ inputs.source_ref }}"
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vision-queue-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Diagnostic only - Foundation queue on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      NEKO_QUEUE_PROBE_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Check out exact diagnostic
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact diagnostic inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          source=os.environ['NEKO_QUEUE_PROBE_SOURCE_SHA']
          assert re.fullmatch('[0-9a-f]{40}',source) and source==os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='soso-so-27/neko-widget'
          assert os.environ['GITHUB_REF']=='refs/heads/diagnostic/automatic-membership-vision-queue-20261016'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          base='9c7149f712e53c77f946095b6c8d6bdd8834fc57'
          assert git('rev-parse','HEAD')==source and git('show','-s','--format=%P',source)==base
          assert not git('status','--porcelain')
          rows=git('diff','--raw','--no-renames','--no-abbrev',base,source).splitlines()
          expected={'.github/workflows/ios-ui-diagnostic.yml':('M',':100644','100644'),
            'NekoWidget/ci/probe-vision-work-queue.swift':('A',':000000','100644'),
            'NekoWidget/ci/probe-vision-work-queue-tests.swift':('A',':000000','100644')}
          assert len(rows)==3
          for row in rows:
              fields,path=row.split('\t');f=fields.split()
              assert path in expected and (f[4],f[0],f[1])==expected.pop(path)
          assert not expected
          PY
      - name: Compile and observe actual queue boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'vision-queue-probe';out.mkdir()
          record={'sourceSHA':os.environ['GITHUB_SHA'],'releaseEvidence':False,'platform':'Linux, not Mac/Vision/UI','commands':[]}
          try:
              def command(args,seconds):
                  started=time.monotonic()
                  r=subprocess.run(args,capture_output=True,text=True,timeout=seconds)
                  record['commands'].append({'args':args,'exit':r.returncode,'seconds':time.monotonic()-started,'stdout':r.stdout,'stderr':r.stderr})
                  assert r.returncode==0
                  return r
              command(['swift','--version'],15)
              source=out/'QueueProbe.swift'
              source.write_text(Path('NekoWidget/ci/probe-vision-work-queue.swift').read_text()+'\n'+Path('NekoWidget/ci/probe-vision-work-queue-tests.swift').read_text())
              binary=out/'QueueProbe'
              command(['swiftc','-swift-version','5','-parse-as-library',str(source),'-o',str(binary)],60)
              command([str(binary)],45)
              record['passed']=True
          finally:
              (out/'result.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Upload small diagnostic record
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vision-queue-${{ github.sha }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/vision-queue-probe/result.json
          retention-days: 7
          if-no-files-found: warn
