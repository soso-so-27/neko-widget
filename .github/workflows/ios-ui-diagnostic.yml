name: iOS focused UI diagnostic
run-name: "PhotoKit and Vision boundary: ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact one-off PhotoKit and Vision probe commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: membership-photo-framework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic only - bounded PhotoKit and Vision probe
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NEKO_FRAMEWORK_PROBE_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Validate one-off identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          if (os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
              or os.environ.get('GITHUB_REF') != 'refs/heads/diagnostic/automatic-membership-photo-framework-v2-20261016'
              or os.environ.get('GITHUB_RUN_ATTEMPT') != '1'
              or re.fullmatch(r'[0-9a-f]{40}', os.environ['NEKO_FRAMEWORK_PROBE_SOURCE_SHA']) is None
              or os.environ['NEKO_FRAMEWORK_PROBE_SOURCE_SHA'] != os.environ['GITHUB_SHA']):
              raise SystemExit('Exact source/ref/attempt required; this is not release evidence')
          PY
      - name: Check out exact probe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Observe bounded PhotoKit and Vision work
        working-directory: NekoWidget
        run: python3 ci/diagnose-photo-framework.py execute
      - name: Upload selected diagnostics only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: photo-framework-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neko-photo-framework-probe/**/*.json
            ${{ runner.temp }}/neko-photo-framework-probe/*.sample.txt
            ${{ runner.temp }}/neko-photo-framework-probe/*.command.txt
            ${{ runner.temp }}/neko-photo-framework-probe/*.swift
          if-no-files-found: warn
          retention-days: 7
