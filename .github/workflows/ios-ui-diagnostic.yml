name: iOS focused UI diagnostic
run-name: "Actual Photos and bounded Vision: ${{ inputs.source_ref }}"
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: membership-vision-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Diagnostic only - actual app Vision queue and Photos
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SMOKE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
      NEKO_IOS_RUNTIME_SCOPE: full-v1
      NEKO_VISION_NATIVE_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Check out exact diagnostic
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Observe actual app without changing UI assertions
        working-directory: NekoWidget
        run: python3 ci/diagnose-vision-native-candidate.py run
      - name: Upload original checkpoint and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vision-native-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/neko-vision-native-diagnostic
            ${{ runner.temp }}/neko-smoke-artifacts
          retention-days: 7
          if-no-files-found: warn
