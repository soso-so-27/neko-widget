name: iOS focused UI diagnostic
run-name: "API semantics probe only - partial job retry, no native or release"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partial-job-api-probe-20261016
  cancel-in-progress: false

jobs:
  probe-plan:
    name: API probe plan
    if: github.ref == 'refs/heads/diagnostic/partial-job-api-probe-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mark original plan
        run: echo 'Original plan; no product checkout, cloud calls or release evidence'
  probe-target:
    name: API probe target
    needs: probe-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mark target execution
        run: echo 'Target execution; no product checkout, cloud calls or release evidence'
  probe-dependent:
    name: API probe dependent
    needs: probe-target
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mark dependent execution
        run: echo 'Dependent execution; no product checkout, cloud calls or release evidence'
  probe-independent:
    name: API probe independent
    needs: probe-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mark independent execution
        run: echo 'Independent execution; no product checkout, cloud calls or release evidence'
