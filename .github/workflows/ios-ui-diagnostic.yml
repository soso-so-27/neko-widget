name: Icon first launch diagnostic
run-name: "Icon first launch diagnostic: ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact full SHA of this diagnostic branch
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    name: Diagnostic only - Release icon first launch (not release evidence)
    runs-on: macos-15
    # No build: the fixed signed bundle is reused only in this diagnostic.
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ICON_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Validate the fixed diagnostic branch and SHA
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          source = os.environ["ICON_DIAGNOSTIC_SOURCE_SHA"]
          if (re.fullmatch(r"[0-9a-f]{40}", source) is None
                  or source != os.environ["GITHUB_SHA"]
                  or os.environ["GITHUB_REPOSITORY"] != "soso-so-27/neko-widget"
                  or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                  or os.environ["GITHUB_REF"] != "refs/heads/diagnostic/icon-first-launch-20260921"):
              raise SystemExit("Use the exact workflow SHA on the fixed icon diagnostic branch.")
          PY
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the one authorized source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          artifact = json.loads(subprocess.check_output([
              "gh", "api", "repos/soso-so-27/neko-widget/actions/artifacts/10612606380"
          ], text=True))
          if (artifact.get("id") != 10612606380 or artifact.get("expired") is not False
                  or artifact.get("name") != "icon-first-launch-diagnostic-94eacc38f5f50376af3d9a1a540d341777439f21-35534630507-1"
                  or artifact.get("workflow_run", {}).get("id") != 35534630507
                  or artifact.get("workflow_run", {}).get("head_sha") != "94eacc38f5f50376af3d9a1a540d341777439f21"):
              raise SystemExit("The fixed diagnostic artifact identity does not match.")
          PY
      - name: Download only the fixed diagnostic source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: icon-first-launch-diagnostic-94eacc38f5f50376af3d9a1a540d341777439f21-35534630507-1
          run-id: 35534630507
          repository: soso-so-27/neko-widget
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/icon-source-artifact
      - name: Verify the reused app and prepare with a real Preferences launch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["GITHUB_SHA"] or head != os.environ["ICON_DIAGNOSTIC_SOURCE_SHA"]:
              raise SystemExit("Checked-out SHA does not match the requested diagnostic.")
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "icon-first-launch-diagnostic"
          artifacts.mkdir(parents=True, exist_ok=True)
          (artifacts / "diagnostic.json").write_text(json.dumps({
              "diagnosticOnly": True, "releaseEvidence": False,
              "sourceSHA": head, "sourceRef": os.environ["GITHUB_REF"],
              "runtime": "iOS 26.2", "xcode": "26.3",
              "reusedSourceSHA": "94eacc38f5f50376af3d9a1a540d341777439f21",
              "reusedRunID": 35534630507, "reusedArtifactID": 10612606380,
              "preparation": "one Preferences launch and PID liveness check, then terminate",
          }, indent=2) + "\n", encoding="utf-8")
          PY
          xcodebuild -version | tee "$RUNNER_TEMP/icon-first-launch-diagnostic/xcode-version.txt"
          # No build or re-signing. Check the fixed ZIP/provenance, unchanged
          # product tree, exact environment and original signature first.
          python3 NekoWidget/ci/verify-app-icon.py \
            --reuse-diagnostic-directory "$RUNNER_TEMP/icon-source-artifact" \
            --artifacts "$RUNNER_TEMP/icon-first-launch-diagnostic" \
            2>&1 | tee "$RUNNER_TEMP/icon-first-launch-diagnostic/diagnostic.log"
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: icon-first-launch-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/icon-first-launch-diagnostic
          if-no-files-found: warn
          retention-days: 7
