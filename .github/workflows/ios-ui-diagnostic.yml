name: iOS focused UI diagnostic
run-name: "Sampler capability only: ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit on diagnostic/automatic-membership-sampler-probe-20261016
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: membership-sampler-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic only - ready Simulator sampler capability
    runs-on: macos-15
    timeout-minutes: 6
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NEKO_SAMPLER_SOURCE: ${{ inputs.source_ref }}
    steps:
      - name: Validate the one-off diagnostic identity before checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          if (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
              or os.environ.get("GITHUB_REF") != "refs/heads/diagnostic/automatic-membership-sampler-probe-20261016"
              or os.environ.get("GITHUB_RUN_ATTEMPT") != "1"
              or re.fullmatch(r"[0-9a-f]{40}", os.environ["NEKO_SAMPLER_SOURCE"]) is None
              or os.environ["NEKO_SAMPLER_SOURCE"] != os.environ["GITHUB_SHA"]):
              raise SystemExit("Use the exact diagnostic branch/SHA once; this is not release evidence.")
          PY
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Probe serial and parallel sampling of an owned ready app
        working-directory: NekoWidget
        shell: bash
        run: python3 ci/diagnose-simulator-sampler.py
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sampler-capability-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neko-sampler-probe
          if-no-files-found: warn
          retention-days: 7
