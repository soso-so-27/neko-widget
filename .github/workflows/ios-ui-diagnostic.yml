name: Icon first launch diagnostic
run-name: "Icon first launch diagnostic: ${{ inputs.source_ref }}"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact full SHA of this diagnostic branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic only - Release icon first launch (not release evidence)
    runs-on: macos-15
    # Observed unsigned build 10m27s + signing/boot/launch failure 3m42s,
    # plus bounded failure probes, exact-device cleanup and artifact upload.
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ICON_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Validate the fixed diagnostic branch and SHA
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          source = os.environ["ICON_DIAGNOSTIC_SOURCE_SHA"]
          if (re.fullmatch(r"[0-9a-f]{40}", source) is None
                  or source != os.environ["GITHUB_SHA"]
                  or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                  or os.environ["GITHUB_REF"] != "refs/heads/diagnostic/icon-first-launch-20260921"):
              raise SystemExit("Use the exact workflow SHA on the fixed icon diagnostic branch.")
          PY
      - name: Check out the exact diagnostic commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reproduce unsigned Release then incremental signing and first launch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != os.environ["GITHUB_SHA"] or head != os.environ["ICON_DIAGNOSTIC_SOURCE_SHA"]:
              raise SystemExit("Checked-out SHA does not match the requested diagnostic.")
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "icon-first-launch-diagnostic"
          artifacts.mkdir(parents=True, exist_ok=True)
          (artifacts / "diagnostic.json").write_text(json.dumps({
              "diagnosticOnly": True, "releaseEvidence": False,
              "sourceSHA": head, "sourceRef": os.environ["GITHUB_REF"],
              "runtime": "iOS 26.2", "xcode": "26.3",
          }, indent=2) + "\n", encoding="utf-8")
          PY
          xcodebuild -version | tee "$RUNNER_TEMP/icon-first-launch-diagnostic/xcode-version.txt"
          # Match the normal Build job's unsigned Release first, then the
          # verifier signs incrementally in this exact same DerivedData.
          date -u '+unsigned Release started: %Y-%m-%dT%H:%M:%SZ'
          xcodebuild -project NekoWidget/NekoWidget.xcodeproj -scheme NekoWidget \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/icon-first-launch-diagnostic/unsigned-build.log"
          date -u '+unsigned Release completed: %Y-%m-%dT%H:%M:%SZ'
          # Keep every icon/signing/alive check and the original launch timeout.
          python3 NekoWidget/ci/verify-app-icon.py \
            --app "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/NekoWidget.app" \
            --artifacts "$RUNNER_TEMP/icon-first-launch-diagnostic" \
            2>&1 | tee "$RUNNER_TEMP/icon-first-launch-diagnostic/diagnostic.log"
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: icon-first-launch-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/icon-first-launch-diagnostic
          if-no-files-found: warn
          retention-days: 7
