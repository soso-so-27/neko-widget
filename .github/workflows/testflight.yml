name: Archive and upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion。空欄ならこのworkflowのrun numberを使います"
        required: false
        type: string
      upload_to_testflight:
        description: "署名・IPA export後にApp Store Connectへ検証・アップロードする"
        required: true
        default: false
        type: boolean
      retain_signed_artifacts:
        description: "IPA・xcarchive・dSYMを暗号化artifactとして14日保存する"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  archive-export-upload:
    name: Archive, export IPA, and upload
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROJECT_DIRECTORY: NekoWidget

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Xcode installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate required secrets
        shell: bash
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          RETAIN_SIGNED_ARTIFACTS: ${{ inputs.retain_signed_artifacts }}
          SIGNED_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.SIGNED_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          signing_required=(
            APPLE_TEAM_ID
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APP_PROVISIONING_PROFILE_BASE64
            WIDGET_PROVISIONING_PROFILE_BASE64
          )
          for variable_name in "${signing_required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing GitHub environment secret: ${variable_name}" >&2
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be a 10-character Team ID." >&2
            exit 1
          fi

          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            if [[ "$RETAIN_SIGNED_ARTIFACTS" != "true" ]]; then
              echo "TestFlight upload requires retain_signed_artifacts=true so the matching archive is preserved." >&2
              exit 1
            fi
            upload_required=(
              APP_STORE_CONNECT_KEY_ID
              APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            )
            for variable_name in "${upload_required[@]}"; do
              if [[ -z "${!variable_name:-}" ]]; then
                echo "Missing GitHub environment secret required for upload: ${variable_name}" >&2
                exit 1
              fi
            done
            if [[ ! "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "APP_STORE_CONNECT_KEY_ID must be a 10-character API Key ID." >&2
              exit 1
            fi
            if [[ ! "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              echo "APP_STORE_CONNECT_ISSUER_ID must be an Issuer UUID." >&2
              exit 1
            fi
            if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" \
              | base64 -D \
              | openssl pkey -noout >/dev/null 2>&1; then
              echo "APP_STORE_CONNECT_PRIVATE_KEY_BASE64 is not a readable private key." >&2
              exit 1
            fi
          fi

          if [[ "$RETAIN_SIGNED_ARTIFACTS" == "true" ]]; then
            if [[ -z "$SIGNED_ARTIFACT_ENCRYPTION_PASSWORD" ]]; then
              echo "Missing GitHub environment secret: SIGNED_ARTIFACT_ENCRYPTION_PASSWORD" >&2
              exit 1
            fi
            if (( ${#SIGNED_ARTIFACT_ENCRYPTION_PASSWORD} < 20 )); then
              echo "SIGNED_ARTIFACT_ENCRYPTION_PASSWORD must contain at least 20 characters." >&2
              exit 1
            fi
          fi

      - name: Read and validate release identifiers
        working-directory: NekoWidget
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          read_xcconfig_value() {
            local key="$1"
            sed -n "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*//p" Config.xcconfig \
              | tail -n 1 \
              | tr -d '\r' \
              | xargs
          }

          app_bundle_id="$(read_xcconfig_value APP_BUNDLE_IDENTIFIER)"
          widget_bundle_id="$(read_xcconfig_value WIDGET_BUNDLE_IDENTIFIER)"
          app_group_id="$(read_xcconfig_value APP_GROUP_IDENTIFIER)"

          if [[ -z "$app_bundle_id" || -z "$widget_bundle_id" || -z "$app_group_id" ]]; then
            echo "Config.xcconfig contains an empty release identifier." >&2
            exit 1
          fi
          if [[ "$app_bundle_id" == com.example.* || "$widget_bundle_id" == com.example.* || "$app_group_id" == group.com.example.* ]]; then
            echo "Replace all placeholder identifiers in Config.xcconfig before uploading." >&2
            exit 1
          fi
          if [[ "$app_group_id" != group.* ]]; then
            echo "APP_GROUP_IDENTIFIER must start with group." >&2
            exit 1
          fi
          bundle_id_pattern='^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
          app_group_pattern='^group\.[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
          if [[ ! "$app_bundle_id" =~ $bundle_id_pattern ]]; then
            echo "APP_BUNDLE_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ ! "$widget_bundle_id" =~ $bundle_id_pattern ]]; then
            echo "WIDGET_BUNDLE_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ ! "$app_group_id" =~ $app_group_pattern ]]; then
            echo "APP_GROUP_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ "$widget_bundle_id" != "$app_bundle_id".* ]]; then
            echo "WIDGET_BUNDLE_IDENTIFIER must be a child of APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi

          build_number="$REQUESTED_BUILD_NUMBER"
          if [[ -z "$build_number" ]]; then
            build_number="$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi

          {
            echo "APP_BUNDLE_ID=$app_bundle_id"
            echo "WIDGET_BUNDLE_ID=$widget_bundle_id"
            echo "APP_GROUP_ID=$app_group_id"
            echo "RELEASE_BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: Install distribution certificate and provisioning profiles
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          app_profile_path="$RUNNER_TEMP/app.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/widget.mobileprovision"
          app_profile_plist="$RUNNER_TEMP/app-profile.plist"
          widget_profile_plist="$RUNNER_TEMP/widget-profile.plist"
          distribution_certificate_pem="$RUNNER_TEMP/apple-distribution.pem"
          distribution_certificate_der="$RUNNER_TEMP/apple-distribution.der"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profile_directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          echo "CI_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 -D > "$app_profile_path"
          printf '%s' "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 -D > "$widget_profile_path"
          chmod 600 "$certificate_path" "$app_profile_path" "$widget_profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'; then
            echo "The P12 does not contain a usable Apple Distribution identity." >&2
            exit 1
          fi
          security find-certificate \
            -c 'Apple Distribution' \
            -p \
            "$keychain_path" \
            > "$distribution_certificate_pem"
          openssl x509 \
            -in "$distribution_certificate_pem" \
            -outform DER \
            -out "$distribution_certificate_der"

          security cms -D -i "$app_profile_path" > "$app_profile_plist"
          security cms -D -i "$widget_profile_path" > "$widget_profile_plist"

          python3 - \
            "$app_profile_plist" \
            "$widget_profile_plist" \
            "$distribution_certificate_der" \
            "$APPLE_TEAM_ID" \
            "$APP_BUNDLE_ID" \
            "$WIDGET_BUNDLE_ID" \
            "$APP_GROUP_ID" <<'PY'
          import datetime
          import hashlib
          import plistlib
          import sys

          app_path, widget_path, certificate_path, team_id, app_id, widget_id, group_id = sys.argv[1:]
          now = datetime.datetime.now(datetime.timezone.utc)

          with open(certificate_path, "rb") as handle:
              signing_certificate = handle.read()

          def validate_profile(path: str, expected_bundle_id: str, label: str) -> None:
              with open(path, "rb") as handle:
                  profile = plistlib.load(handle)
              entitlements = profile.get("Entitlements", {})
              teams = profile.get("TeamIdentifier", [])
              expiration = profile.get("ExpirationDate")
              application_identifier = entitlements.get("application-identifier", "")
              groups = entitlements.get("com.apple.security.application-groups", [])
              certificates = profile.get("DeveloperCertificates", [])

              if team_id not in teams:
                  raise SystemExit(f"{label} profile belongs to another Team.")
              if application_identifier != f"{team_id}.{expected_bundle_id}":
                  raise SystemExit(f"{label} profile has the wrong application-identifier.")
              if group_id not in groups:
                  raise SystemExit(f"{label} profile does not contain the App Group.")
              if entitlements.get("get-task-allow") is not False:
                  raise SystemExit(f"{label} profile is not a distribution profile (get-task-allow).")
              if profile.get("ProvisionsAllDevices") is True or profile.get("ProvisionedDevices"):
                  raise SystemExit(f"{label} profile is not an App Store Connect distribution profile.")
              if not isinstance(expiration, datetime.datetime):
                  raise SystemExit(f"{label} profile has no readable ExpirationDate.")
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=datetime.timezone.utc)
              if expiration <= now:
                  raise SystemExit(f"{label} profile is expired.")
              if not any(bytes(value) == signing_certificate for value in certificates):
                  profile_hashes = ",".join(
                      hashlib.sha256(bytes(value)).hexdigest()[:12] for value in certificates
                  )
                  raise SystemExit(
                      f"{label} profile does not contain the P12 certificate "
                      f"(profile certificate hashes: {profile_hashes or 'none'})."
                  )

          validate_profile(app_path, app_id, "App")
          validate_profile(widget_path, widget_id, "Widget")
          PY

          app_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$app_profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          app_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$app_profile_plist")"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          app_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$app_profile_plist")"
          widget_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$widget_profile_plist")"
          app_profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$app_profile_plist")"
          widget_profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_profile_plist")"
          app_profile_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$app_profile_plist" 2>/dev/null || true)"
          widget_profile_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$widget_profile_plist" 2>/dev/null || true)"

          contains_exact_line() {
            local expected="$1"
            awk -v expected="$expected" '{ $1 = $1; if ($0 == expected) found = 1 } END { exit(found ? 0 : 1) }'
          }

          if [[ "$app_profile_team" != "$APPLE_TEAM_ID" || "$widget_profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "A provisioning profile belongs to a different Apple Developer Team." >&2
            exit 1
          fi
          if [[ "$app_profile_identifier" != "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]; then
            echo "The app provisioning profile does not match APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [[ "$widget_profile_identifier" != "$APPLE_TEAM_ID.$WIDGET_BUNDLE_ID" ]]; then
            echo "The widget provisioning profile does not match WIDGET_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if ! contains_exact_line "$APP_GROUP_ID" <<< "$app_profile_groups"; then
            echo "The app provisioning profile does not contain APP_GROUP_IDENTIFIER." >&2
            exit 1
          fi
          if ! contains_exact_line "$APP_GROUP_ID" <<< "$widget_profile_groups"; then
            echo "The widget provisioning profile does not contain APP_GROUP_IDENTIFIER." >&2
            exit 1
          fi

          mkdir -p "$profile_directory"
          {
            echo "APP_INSTALLED_PROFILE_PATH=$profile_directory/$app_profile_uuid.mobileprovision"
            echo "WIDGET_INSTALLED_PROFILE_PATH=$profile_directory/$widget_profile_uuid.mobileprovision"
          } >> "$GITHUB_ENV"
          cp "$app_profile_path" "$profile_directory/$app_profile_uuid.mobileprovision"
          cp "$widget_profile_path" "$profile_directory/$widget_profile_uuid.mobileprovision"

          {
            echo "APP_PROFILE_UUID=$app_profile_uuid"
            echo "WIDGET_PROFILE_UUID=$widget_profile_uuid"
            echo "APP_PROFILE_SPECIFIER=$app_profile_name"
            echo "WIDGET_PROFILE_SPECIFIER=$widget_profile_name"
          } >> "$GITHUB_ENV"

      - name: Archive app and widget
        working-directory: NekoWidget
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project NekoWidget.xcodeproj \
            -scheme NekoWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NekoWidget.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NekoWidgetArchive.xcresult" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_SPECIFIER" \
            WIDGET_PROVISIONING_PROFILE_SPECIFIER="$WIDGET_PROFILE_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $CI_KEYCHAIN_PATH" \
            archive

      - name: Verify archive signatures and App Group entitlements
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/NekoWidget.xcarchive/Products/Applications/NekoWidget.app"
          widget_path="$app_path/PlugIns/NekoWidgetWidgetExtension.appex"
          app_entitlements="$RUNNER_TEMP/archive-app-entitlements.plist"
          widget_entitlements="$RUNNER_TEMP/archive-widget-entitlements.plist"

          test -d "$app_path"
          test -d "$widget_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$widget_path"
          codesign -d --entitlements :- "$app_path" > "$app_entitlements"
          codesign -d --entitlements :- "$widget_path" > "$widget_entitlements"
          plutil -lint "$app_entitlements"
          plutil -lint "$widget_entitlements"

          app_signed_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$app_entitlements")"
          widget_signed_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$widget_entitlements")"
          app_signed_team="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$app_entitlements")"
          widget_signed_team="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$widget_entitlements")"
          app_signed_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$app_entitlements" 2>/dev/null || true)"
          widget_signed_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$widget_entitlements" 2>/dev/null || true)"

          contains_exact_line() {
            local expected="$1"
            awk -v expected="$expected" '{ $1 = $1; if ($0 == expected) found = 1 } END { exit(found ? 0 : 1) }'
          }

          [[ "$app_signed_identifier" == "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]
          [[ "$widget_signed_identifier" == "$APPLE_TEAM_ID.$WIDGET_BUNDLE_ID" ]]
          [[ "$app_signed_team" == "$APPLE_TEAM_ID" ]]
          [[ "$widget_signed_team" == "$APPLE_TEAM_ID" ]]
          contains_exact_line "$APP_GROUP_ID" <<< "$app_signed_groups"
          contains_exact_line "$APP_GROUP_ID" <<< "$widget_signed_groups"

      - name: Generate export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed \
            -e "s|__APPLE_TEAM_ID__|$APPLE_TEAM_ID|g" \
            -e "s|__APP_BUNDLE_ID__|$APP_BUNDLE_ID|g" \
            -e "s|__WIDGET_BUNDLE_ID__|$WIDGET_BUNDLE_ID|g" \
            -e "s|__APP_PROFILE_UUID__|$APP_PROFILE_UUID|g" \
            -e "s|__WIDGET_PROFILE_UUID__|$WIDGET_PROFILE_UUID|g" \
            "$PROJECT_DIRECTORY/ci/ExportOptions.plist.template" \
            > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NekoWidget.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ipa_path="$(find "$RUNNER_TEMP/Export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "xcodebuild did not produce an IPA." >&2
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Package archive and symbols
        if: ${{ inputs.retain_signed_artifacts }}
        shell: bash
        env:
          SIGNED_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.SIGNED_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/NekoWidget.xcarchive"
          test -f "$IPA_PATH"
          ipa_directory="$(dirname "$IPA_PATH")"
          ipa_filename="$(basename "$IPA_PATH")"
          tar \
            -C "$RUNNER_TEMP" \
            -czf - \
            NekoWidget.xcarchive \
            -C "$ipa_directory" \
            "$ipa_filename" \
            | openssl enc \
                -aes-256-cbc \
                -salt \
                -pbkdf2 \
                -iter 200000 \
                -pass env:SIGNED_ARTIFACT_ENCRYPTION_PASSWORD \
                -out "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc"
          test -s "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc"
          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -pass env:SIGNED_ARTIFACT_ENCRYPTION_PASSWORD \
            -in "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc" \
            | tar -tzf - \
            | tee "$RUNNER_TEMP/signed-artifact-contents.txt"
          grep -q '^NekoWidget.xcarchive/' "$RUNNER_TEMP/signed-artifact-contents.txt"
          grep -Fxq "$ipa_filename" "$RUNNER_TEMP/signed-artifact-contents.txt"

      - name: Upload encrypted signed app and symbols
        if: ${{ inputs.retain_signed_artifacts }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekowidget-signed-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/NekoWidget-signed-artifacts.tar.gz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Install App Store Connect API private key
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          private_key_directory="$HOME/.appstoreconnect/private_keys"
          private_key_path="$private_key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "API_PRIVATE_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"
          mkdir -p "$private_key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$private_key_path"
          chmod 600 "$private_key_path"

      - name: Validate and upload IPA to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Write release summary
        if: always()
        shell: bash
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          RETAIN_SIGNED_ARTIFACTS: ${{ inputs.retain_signed_artifacts }}
        run: |
          {
            echo "## NekoWidget release workflow"
            echo
            echo "- Upload requested: \`$UPLOAD_TO_TESTFLIGHT\`"
            echo "- Retain encrypted signed artifacts: \`$RETAIN_SIGNED_ARTIFACTS\`"
            echo "- Build number: \`${RELEASE_BUILD_NUMBER:-not resolved}\`"
            if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
              echo "- Intended result: signed archive, IPA export, validation, and TestFlight upload"
            else
              echo "- Intended result: signed archive and IPA export only; nothing is sent to App Store Connect"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${APP_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$APP_INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${WIDGET_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$WIDGET_INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$CI_KEYCHAIN_PATH"
          fi
          if [[ -n "${API_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f "$API_PRIVATE_KEY_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/app.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/app-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist" \
            "$RUNNER_TEMP/apple-distribution.pem" \
            "$RUNNER_TEMP/apple-distribution.der" \
            "$RUNNER_TEMP/archive-app-entitlements.plist" \
            "$RUNNER_TEMP/archive-widget-entitlements.plist" \
            "$RUNNER_TEMP/signed-artifact-contents.txt" \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nekowidget-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Export/DistributionSummary.plist
            ${{ runner.temp }}/Export/ExportOptions.plist
            ${{ runner.temp }}/NekoWidgetArchive.xcresult
          if-no-files-found: warn
          retention-days: 14
