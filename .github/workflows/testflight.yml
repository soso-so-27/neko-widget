name: Archive and upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion。空欄ならこのworkflowのrun numberを使います"
        required: false
        type: string
      release_mode:
        description: "配布範囲。通常はreview-preview、Build 28はpairing-only、次の2台写真確認だけmedia-staging"
        required: true
        default: review-preview
        type: choice
        options:
          - review-preview
          - pairing-only
          - media-staging
      upload_to_testflight:
        description: "署名・IPA export後にApp Store Connectへ検証・アップロードする"
        required: true
        default: false
        type: boolean
      retain_signed_artifacts:
        description: "IPA・xcarchive・dSYMを暗号化artifactとして14日保存する"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  archive-export-upload:
    name: Archive, export IPA, and upload
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PROJECT_DIRECTORY: NekoWidget

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify Xcode installation
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Select fail-closed release mode
        shell: bash
        env:
          SELECTED_RELEASE_MODE: ${{ inputs.release_mode }}
          SHARING_STAGING_API_ORIGIN: ${{ vars.SHARING_STAGING_API_ORIGIN }}
          SHARING_STAGING_MODERATION_KEY_ID: ${{ vars.SHARING_STAGING_MODERATION_KEY_ID }}
          SHARING_STAGING_MODERATION_PUBLIC_KEY: ${{ vars.SHARING_STAGING_MODERATION_PUBLIC_KEY }}
          SHARING_STAGING_PRIVACY_URL: ${{ vars.SHARING_STAGING_PRIVACY_URL }}
          SHARING_STAGING_SUPPORT_URL: ${{ vars.SHARING_STAGING_SUPPORT_URL }}
          SHARING_STAGING_COMMUNITY_STANDARDS_URL: ${{ vars.SHARING_STAGING_COMMUNITY_STANDARDS_URL }}
        run: |
          set -euo pipefail
          release_moderation_key_id=""
          release_moderation_public_key=""
          release_privacy_url=""
          release_support_url=""
          release_community_standards_url=""
          case "$SELECTED_RELEASE_MODE" in
            review-preview)
              release_origin=""
              release_summary="review-preview/runtime disabled"
              release_feature="NO"
              release_media="NO"
              release_handoff="NO"
              release_direct_send="NO"
              release_review_preview="YES"
              ;;
            pairing-only)
              release_origin="${SHARING_STAGING_API_ORIGIN:-}"
              release_summary="pairing-only/photos disabled"
              release_feature="YES"
              release_media="NO"
              release_handoff="NO"
              release_direct_send="NO"
              release_review_preview="NO"
              if [[ -z "$release_origin" ]]; then
                echo "The protected testflight Environment variable SHARING_STAGING_API_ORIGIN is required for pairing-only." >&2
                exit 1
              fi
              cp \
                "$PROJECT_DIRECTORY/ci/PrivacyInfo.PairingOnly.xcprivacy" \
                "$PROJECT_DIRECTORY/NekoWidget/PrivacyInfo.xcprivacy"
              ;;
            media-staging)
              release_origin="${SHARING_STAGING_API_ORIGIN:-}"
              release_moderation_key_id="${SHARING_STAGING_MODERATION_KEY_ID:-}"
              release_moderation_public_key="${SHARING_STAGING_MODERATION_PUBLIC_KEY:-}"
              release_privacy_url="${SHARING_STAGING_PRIVACY_URL:-}"
              release_support_url="${SHARING_STAGING_SUPPORT_URL:-}"
              release_community_standards_url="${SHARING_STAGING_COMMUNITY_STANDARDS_URL:-}"
              release_summary="media-staging/two-device one-photo sharing"
              release_feature="YES"
              release_media="YES"
              release_handoff="YES"
              release_direct_send="NO"
              release_review_preview="NO"
              cp \
                "$PROJECT_DIRECTORY/ci/PrivacyInfo.MediaStaging.xcprivacy" \
                "$PROJECT_DIRECTORY/NekoWidget/PrivacyInfo.xcprivacy"
              ;;
            *)
              echo "Unknown release_mode: $SELECTED_RELEASE_MODE" >&2
              exit 1
              ;;
          esac

          python3 - \
            "$SELECTED_RELEASE_MODE" \
            "$release_origin" \
            "$release_moderation_key_id" \
            "$release_moderation_public_key" \
            "$release_privacy_url" \
            "$release_support_url" \
            "$release_community_standards_url" <<'PY'
          import base64
          import binascii
          import ipaddress
          import re
          import socket
          import sys
          from urllib.parse import urlparse

          (
              mode,
              origin,
              moderation_key_id,
              moderation_public_key,
              privacy_url,
              support_url,
              community_url,
          ) = sys.argv[1:]

          reserved = (
              ".example", ".invalid", ".local", ".localhost", ".test",
              ".internal", ".lan", ".home.arpa",
          )

          def public_https(value: str, label: str, *, origin_only: bool) -> tuple[str, int]:
              raw = value.strip()
              if raw != value or any(ord(character) < 32 for character in raw):
                  raise SystemExit(f"{label} must not contain surrounding whitespace or control characters.")
              parsed = urlparse(raw)
              raw_host = (parsed.hostname or "").lower()
              host = raw_host.rstrip(".")
              try:
                  port = parsed.port
              except ValueError as error:
                  raise SystemExit(f"{label} contains an invalid port.") from error
              try:
                  address = ipaddress.ip_address(host)
              except ValueError:
                  address = None
              if (
                  parsed.scheme != "https"
                  or not host
                  or raw_host.endswith(".")
                  or "." not in host
                  or host == "localhost"
                  or host.endswith(reserved)
                  or address is not None
                  or parsed.username is not None
                  or parsed.password is not None
                  or (origin_only and parsed.path not in ("", "/"))
                  or parsed.params
                  or parsed.query
                  or parsed.fragment
                  or "$" in raw
                  or "REPLACE" in raw.upper()
              ):
                  kind = "origin" if origin_only else "URL"
                  raise SystemExit(f"{label} must be a non-placeholder public HTTPS {kind}.")
              return host, port or 443

          def require_public_dns(host: str, port: int, label: str) -> None:
              try:
                  resolved = {
                      item[4][0]
                      for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
                  }
              except socket.gaierror as error:
                  raise SystemExit(f"{label} must resolve in public DNS: {error}") from error
              if not resolved or any(
                  not ipaddress.ip_address(value).is_global for value in resolved
              ):
                  raise SystemExit(f"{label} must resolve only to public IP addresses.")

          if mode not in {"review-preview", "pairing-only", "media-staging"}:
              raise SystemExit(f"Unknown release mode: {mode}")

          if mode == "review-preview":
              if any((origin, moderation_key_id, moderation_public_key, privacy_url, support_url, community_url)):
                  raise SystemExit("review-preview must not receive sharing runtime configuration.")
          else:
              if not origin:
                  raise SystemExit("SHARING_STAGING_API_ORIGIN is required for enabled sharing modes.")
              host, port = public_https(
                  origin, "SHARING_STAGING_API_ORIGIN", origin_only=True
              )
              require_public_dns(host, port, "SHARING_STAGING_API_ORIGIN")

          safety_values = (
              moderation_key_id,
              moderation_public_key,
              privacy_url,
              support_url,
              community_url,
          )
          if mode == "pairing-only" and any(safety_values):
              raise SystemExit("pairing-only must not receive media safety configuration.")

          if mode == "media-staging":
              if moderation_key_id != "moderation-v1":
                  raise SystemExit(
                      "SHARING_STAGING_MODERATION_KEY_ID must be exactly moderation-v1."
                  )
              try:
                  if re.fullmatch(r"[A-Za-z0-9_-]{43}", moderation_public_key) is None:
                      raise ValueError("non-canonical base64url")
                  decoded_key = base64.b64decode(
                      moderation_public_key.replace("-", "+").replace("_", "/") + "=",
                      validate=True,
                  )
                  canonical_key = base64.urlsafe_b64encode(decoded_key).decode("ascii").rstrip("=")
                  if canonical_key != moderation_public_key:
                      raise ValueError("non-canonical base64url")
              except (ValueError, binascii.Error) as error:
                  raise SystemExit(
                      "SHARING_STAGING_MODERATION_PUBLIC_KEY must be a canonical 32-byte base64url key."
                  ) from error
              if len(decoded_key) != 32:
                  raise SystemExit(
                      "SHARING_STAGING_MODERATION_PUBLIC_KEY must be a canonical 32-byte base64url key."
                  )
              normalized_key = bytearray(decoded_key)
              normalized_key[31] &= 0x7f
              small_order_keys = {
                  bytes.fromhex("00" * 32),
                  bytes.fromhex("01" + ("00" * 31)),
                  bytes.fromhex("e0eb7a7c3b41b8ae1656e3faf19fc46ada098deb9c32b1fd866205165f49b800"),
                  bytes.fromhex("5f9c95bca3508c24b1d0b1559c83ef5b04445cc4581c8e86d8224eddd09f1157"),
                  bytes.fromhex("ec" + ("ff" * 30) + "7f"),
                  bytes.fromhex("ed" + ("ff" * 30) + "7f"),
                  bytes.fromhex("ee" + ("ff" * 30) + "7f"),
              }
              if bytes(normalized_key) in small_order_keys:
                  raise SystemExit(
                      "SHARING_STAGING_MODERATION_PUBLIC_KEY must not be a small-order X25519 point."
                  )
              for policy_url, label in (
                  (privacy_url, "SHARING_STAGING_PRIVACY_URL"),
                  (support_url, "SHARING_STAGING_SUPPORT_URL"),
                  (
                      community_url,
                      "SHARING_STAGING_COMMUNITY_STANDARDS_URL",
                  ),
              ):
                  host, port = public_https(policy_url, label, origin_only=False)
                  require_public_dns(host, port, label)
          PY

          plutil -lint "$PROJECT_DIRECTORY/NekoWidget/PrivacyInfo.xcprivacy"
          {
            echo "SHARING_EXPECTED_MODE=$SELECTED_RELEASE_MODE"
            echo "RELEASE_SHARING_RELEASE_MODE=$SELECTED_RELEASE_MODE"
            echo "RELEASE_SHARING_FEATURE_ENABLED=$release_feature"
            echo "RELEASE_SHARING_MEDIA_ENABLED=$release_media"
            echo "RELEASE_SHARING_HANDOFF_ENABLED=$release_handoff"
            echo "RELEASE_SHARING_DIRECT_SEND_ENABLED=$release_direct_send"
            echo "RELEASE_SHARING_REVIEW_PREVIEW_ENABLED=$release_review_preview"
            echo "RELEASE_SHARING_API_ORIGIN=$release_origin"
            echo "RELEASE_SHARING_MODERATION_KEY_ID=$release_moderation_key_id"
            echo "RELEASE_SHARING_MODERATION_PUBLIC_KEY=$release_moderation_public_key"
            echo "RELEASE_SHARING_PRIVACY_URL=$release_privacy_url"
            echo "RELEASE_SHARING_SUPPORT_URL=$release_support_url"
            echo "RELEASE_SHARING_COMMUNITY_STANDARDS_URL=$release_community_standards_url"
            echo "RELEASE_MODE_SUMMARY=$release_summary"
          } >> "$GITHUB_ENV"

      - name: Validate required secrets
        shell: bash
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          RETAIN_SIGNED_ARTIFACTS: ${{ inputs.retain_signed_artifacts }}
          SIGNED_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.SIGNED_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          signing_required=(
            APPLE_TEAM_ID
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APP_PROVISIONING_PROFILE_BASE64
            WIDGET_PROVISIONING_PROFILE_BASE64
            SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64
          )
          for variable_name in "${signing_required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing GitHub environment secret: ${variable_name}" >&2
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be a 10-character Team ID." >&2
            exit 1
          fi

          if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
            if [[ "$RETAIN_SIGNED_ARTIFACTS" != "true" ]]; then
              echo "TestFlight upload requires retain_signed_artifacts=true so the matching archive is preserved." >&2
              exit 1
            fi
            upload_required=(
              APP_STORE_CONNECT_KEY_ID
              APP_STORE_CONNECT_ISSUER_ID
              APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            )
            for variable_name in "${upload_required[@]}"; do
              if [[ -z "${!variable_name:-}" ]]; then
                echo "Missing GitHub environment secret required for upload: ${variable_name}" >&2
                exit 1
              fi
            done
            if [[ ! "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "APP_STORE_CONNECT_KEY_ID must be a 10-character API Key ID." >&2
              exit 1
            fi
            if [[ ! "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
              echo "APP_STORE_CONNECT_ISSUER_ID must be an Issuer UUID." >&2
              exit 1
            fi
            if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" \
              | base64 -D \
              | openssl pkey -noout >/dev/null 2>&1; then
              echo "APP_STORE_CONNECT_PRIVATE_KEY_BASE64 is not a readable private key." >&2
              exit 1
            fi
          fi

          if [[ "$RETAIN_SIGNED_ARTIFACTS" == "true" ]]; then
            if [[ -z "$SIGNED_ARTIFACT_ENCRYPTION_PASSWORD" ]]; then
              echo "Missing GitHub environment secret: SIGNED_ARTIFACT_ENCRYPTION_PASSWORD" >&2
              exit 1
            fi
            if (( ${#SIGNED_ARTIFACT_ENCRYPTION_PASSWORD} < 20 )); then
              echo "SIGNED_ARTIFACT_ENCRYPTION_PASSWORD must contain at least 20 characters." >&2
              exit 1
            fi
          fi

      - name: Read and validate release identifiers
        working-directory: NekoWidget
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          read_xcconfig_value() {
            local key="$1"
            sed -n "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*//p" Config.xcconfig \
              | tail -n 1 \
              | tr -d '\r' \
              | xargs
          }

          app_bundle_id="$(read_xcconfig_value APP_BUNDLE_IDENTIFIER)"
          widget_bundle_id="$(read_xcconfig_value WIDGET_BUNDLE_IDENTIFIER)"
          share_extension_bundle_id="$(read_xcconfig_value SHARE_EXTENSION_BUNDLE_IDENTIFIER)"
          app_group_id="$(read_xcconfig_value APP_GROUP_IDENTIFIER)"

          if [[ -z "$app_bundle_id" || -z "$widget_bundle_id" || -z "$share_extension_bundle_id" || -z "$app_group_id" ]]; then
            echo "Config.xcconfig contains an empty release identifier." >&2
            exit 1
          fi
          if [[ "$app_bundle_id" == com.example.* || "$widget_bundle_id" == com.example.* || "$share_extension_bundle_id" == com.example.* || "$app_group_id" == group.com.example.* ]]; then
            echo "Replace all placeholder identifiers in Config.xcconfig before uploading." >&2
            exit 1
          fi
          if [[ "$app_group_id" != group.* ]]; then
            echo "APP_GROUP_IDENTIFIER must start with group." >&2
            exit 1
          fi
          bundle_id_pattern='^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
          app_group_pattern='^group\.[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
          if [[ ! "$app_bundle_id" =~ $bundle_id_pattern ]]; then
            echo "APP_BUNDLE_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ ! "$widget_bundle_id" =~ $bundle_id_pattern ]]; then
            echo "WIDGET_BUNDLE_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ ! "$share_extension_bundle_id" =~ $bundle_id_pattern ]]; then
            echo "SHARE_EXTENSION_BUNDLE_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ ! "$app_group_id" =~ $app_group_pattern ]]; then
            echo "APP_GROUP_IDENTIFIER contains unsupported characters or empty components." >&2
            exit 1
          fi
          if [[ "$widget_bundle_id" != "$app_bundle_id".* ]]; then
            echo "WIDGET_BUNDLE_IDENTIFIER must be a child of APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [[ "$share_extension_bundle_id" != "$app_bundle_id".* ]]; then
            echo "SHARE_EXTENSION_BUNDLE_IDENTIFIER must be a child of APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [[ "$share_extension_bundle_id" == "$widget_bundle_id" ]]; then
            echo "Widget and Share Extension bundle identifiers must differ." >&2
            exit 1
          fi

          build_number="$REQUESTED_BUILD_NUMBER"
          if [[ -z "$build_number" ]]; then
            build_number="$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer." >&2
            exit 1
          fi

          {
            echo "APP_BUNDLE_ID=$app_bundle_id"
            echo "WIDGET_BUNDLE_ID=$widget_bundle_id"
            echo "SHARE_EXTENSION_BUNDLE_ID=$share_extension_bundle_id"
            echo "APP_GROUP_ID=$app_group_id"
            echo "RELEASE_BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"

      - name: Install distribution certificate and provisioning profiles
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          app_profile_path="$RUNNER_TEMP/app.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/widget.mobileprovision"
          share_profile_path="$RUNNER_TEMP/share-extension.mobileprovision"
          app_profile_plist="$RUNNER_TEMP/app-profile.plist"
          widget_profile_plist="$RUNNER_TEMP/widget-profile.plist"
          share_profile_plist="$RUNNER_TEMP/share-extension-profile.plist"
          distribution_certificate_pem="$RUNNER_TEMP/apple-distribution.pem"
          distribution_certificate_der="$RUNNER_TEMP/apple-distribution.der"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          profile_directory="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          echo "CI_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 -D > "$app_profile_path"
          printf '%s' "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 -D > "$widget_profile_path"
          printf '%s' "$SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 -D > "$share_profile_path"
          chmod 600 "$certificate_path" "$app_profile_path" "$widget_profile_path" "$share_profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" | grep -q 'Apple Distribution'; then
            echo "The P12 does not contain a usable Apple Distribution identity." >&2
            exit 1
          fi
          security find-certificate \
            -c 'Apple Distribution' \
            -p \
            "$keychain_path" \
            > "$distribution_certificate_pem"
          openssl x509 \
            -in "$distribution_certificate_pem" \
            -outform DER \
            -out "$distribution_certificate_der"

          security cms -D -i "$app_profile_path" > "$app_profile_plist"
          security cms -D -i "$widget_profile_path" > "$widget_profile_plist"
          security cms -D -i "$share_profile_path" > "$share_profile_plist"

          python3 - \
            "$app_profile_plist" \
            "$widget_profile_plist" \
            "$share_profile_plist" \
            "$distribution_certificate_der" \
            "$APPLE_TEAM_ID" \
            "$APP_BUNDLE_ID" \
            "$WIDGET_BUNDLE_ID" \
            "$SHARE_EXTENSION_BUNDLE_ID" \
            "$APP_GROUP_ID" <<'PY'
          import datetime
          import hashlib
          import plistlib
          import sys

          app_path, widget_path, share_path, certificate_path, team_id, app_id, widget_id, share_id, group_id = sys.argv[1:]
          now = datetime.datetime.now(datetime.timezone.utc)

          with open(certificate_path, "rb") as handle:
              signing_certificate = handle.read()

          def validate_profile(path: str, expected_bundle_id: str, label: str, requires_safety_analysis: bool = False) -> None:
              with open(path, "rb") as handle:
                  profile = plistlib.load(handle)
              entitlements = profile.get("Entitlements", {})
              teams = profile.get("TeamIdentifier", [])
              expiration = profile.get("ExpirationDate")
              application_identifier = entitlements.get("application-identifier", "")
              groups = entitlements.get("com.apple.security.application-groups", [])
              certificates = profile.get("DeveloperCertificates", [])
              safety_analysis = entitlements.get("com.apple.developer.sensitivecontentanalysis.client", [])

              if team_id not in teams:
                  raise SystemExit(f"{label} profile belongs to another Team.")
              if application_identifier != f"{team_id}.{expected_bundle_id}":
                  raise SystemExit(f"{label} profile has the wrong application-identifier.")
              if group_id not in groups:
                  raise SystemExit(f"{label} profile does not contain the App Group.")
              if requires_safety_analysis and safety_analysis != ["analysis"]:
                  raise SystemExit(f"{label} profile does not contain Sensitive Content Analysis entitlement.")
              if not requires_safety_analysis and safety_analysis:
                  raise SystemExit(f"{label} profile unexpectedly contains Sensitive Content Analysis entitlement.")
              if entitlements.get("get-task-allow") is not False:
                  raise SystemExit(f"{label} profile is not a distribution profile (get-task-allow).")
              if profile.get("ProvisionsAllDevices") is True or profile.get("ProvisionedDevices"):
                  raise SystemExit(f"{label} profile is not an App Store Connect distribution profile.")
              if not isinstance(expiration, datetime.datetime):
                  raise SystemExit(f"{label} profile has no readable ExpirationDate.")
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=datetime.timezone.utc)
              if expiration <= now:
                  raise SystemExit(f"{label} profile is expired.")
              if not any(bytes(value) == signing_certificate for value in certificates):
                  profile_hashes = ",".join(
                      hashlib.sha256(bytes(value)).hexdigest()[:12] for value in certificates
                  )
                  raise SystemExit(
                      f"{label} profile does not contain the P12 certificate "
                      f"(profile certificate hashes: {profile_hashes or 'none'})."
                  )

          validate_profile(app_path, app_id, "App", requires_safety_analysis=True)
          validate_profile(widget_path, widget_id, "Widget")
          validate_profile(share_path, share_id, "Share Extension", requires_safety_analysis=False)
          PY

          app_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$app_profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          share_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$share_profile_plist")"
          app_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$app_profile_plist")"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          share_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$share_profile_plist")"
          app_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$app_profile_plist")"
          widget_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$widget_profile_plist")"
          share_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$share_profile_plist")"
          app_profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$app_profile_plist")"
          widget_profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_profile_plist")"
          share_profile_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$share_profile_plist")"
          app_profile_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$app_profile_plist" 2>/dev/null || true)"
          widget_profile_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$widget_profile_plist" 2>/dev/null || true)"
          share_profile_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$share_profile_plist" 2>/dev/null || true)"

          contains_exact_line() {
            local expected="$1"
            awk -v expected="$expected" '{ $1 = $1; if ($0 == expected) found = 1 } END { exit(found ? 0 : 1) }'
          }

          if [[ "$app_profile_team" != "$APPLE_TEAM_ID" || "$widget_profile_team" != "$APPLE_TEAM_ID" || "$share_profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "A provisioning profile belongs to a different Apple Developer Team." >&2
            exit 1
          fi
          if [[ "$app_profile_identifier" != "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]; then
            echo "The app provisioning profile does not match APP_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [[ "$widget_profile_identifier" != "$APPLE_TEAM_ID.$WIDGET_BUNDLE_ID" ]]; then
            echo "The widget provisioning profile does not match WIDGET_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if [[ "$share_profile_identifier" != "$APPLE_TEAM_ID.$SHARE_EXTENSION_BUNDLE_ID" ]]; then
            echo "The Share Extension provisioning profile does not match SHARE_EXTENSION_BUNDLE_IDENTIFIER." >&2
            exit 1
          fi
          if ! contains_exact_line "$APP_GROUP_ID" <<< "$app_profile_groups"; then
            echo "The app provisioning profile does not contain APP_GROUP_IDENTIFIER." >&2
            exit 1
          fi
          if ! contains_exact_line "$APP_GROUP_ID" <<< "$widget_profile_groups"; then
            echo "The widget provisioning profile does not contain APP_GROUP_IDENTIFIER." >&2
            exit 1
          fi
          if ! contains_exact_line "$APP_GROUP_ID" <<< "$share_profile_groups"; then
            echo "The Share Extension provisioning profile does not contain APP_GROUP_IDENTIFIER." >&2
            exit 1
          fi

          mkdir -p "$profile_directory"
          {
            echo "APP_INSTALLED_PROFILE_PATH=$profile_directory/$app_profile_uuid.mobileprovision"
            echo "WIDGET_INSTALLED_PROFILE_PATH=$profile_directory/$widget_profile_uuid.mobileprovision"
            echo "SHARE_INSTALLED_PROFILE_PATH=$profile_directory/$share_profile_uuid.mobileprovision"
          } >> "$GITHUB_ENV"
          cp "$app_profile_path" "$profile_directory/$app_profile_uuid.mobileprovision"
          cp "$widget_profile_path" "$profile_directory/$widget_profile_uuid.mobileprovision"
          cp "$share_profile_path" "$profile_directory/$share_profile_uuid.mobileprovision"

          {
            echo "APP_PROFILE_UUID=$app_profile_uuid"
            echo "WIDGET_PROFILE_UUID=$widget_profile_uuid"
            echo "SHARE_PROFILE_UUID=$share_profile_uuid"
            echo "APP_PROFILE_SPECIFIER=$app_profile_name"
            echo "WIDGET_PROFILE_SPECIFIER=$widget_profile_name"
            echo "SHARE_PROFILE_SPECIFIER=$share_profile_name"
          } >> "$GITHUB_ENV"

      - name: Archive app and widget
        working-directory: NekoWidget
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project NekoWidget.xcodeproj \
            -scheme NekoWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NekoWidget.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NekoWidgetArchive.xcresult" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            APP_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_SPECIFIER" \
            WIDGET_PROVISIONING_PROFILE_SPECIFIER="$WIDGET_PROFILE_SPECIFIER" \
            SHARE_EXTENSION_PROVISIONING_PROFILE_SPECIFIER="$SHARE_PROFILE_SPECIFIER" \
            SHARING_RELEASE_MODE="$RELEASE_SHARING_RELEASE_MODE" \
            SHARING_FEATURE_ENABLED="$RELEASE_SHARING_FEATURE_ENABLED" \
            SHARING_MEDIA_ENABLED="$RELEASE_SHARING_MEDIA_ENABLED" \
            SHARING_SHARE_EXTENSION_HANDOFF_ENABLED="$RELEASE_SHARING_HANDOFF_ENABLED" \
            SHARING_SHARE_EXTENSION_SEND_ENABLED="$RELEASE_SHARING_DIRECT_SEND_ENABLED" \
            SHARING_REVIEW_PREVIEW_ENABLED="$RELEASE_SHARING_REVIEW_PREVIEW_ENABLED" \
            SHARING_API_BASE_URL="$RELEASE_SHARING_API_ORIGIN" \
            SHARING_MODERATION_KEY_ID="$RELEASE_SHARING_MODERATION_KEY_ID" \
            SHARING_MODERATION_PUBLIC_KEY="$RELEASE_SHARING_MODERATION_PUBLIC_KEY" \
            SHARING_PRIVACY_URL="$RELEASE_SHARING_PRIVACY_URL" \
            SHARING_SUPPORT_URL="$RELEASE_SHARING_SUPPORT_URL" \
            SHARING_COMMUNITY_STANDARDS_URL="$RELEASE_SHARING_COMMUNITY_STANDARDS_URL" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $CI_KEYCHAIN_PATH" \
            archive

      - name: Validate sharing privacy and export gates
        shell: bash
        env:
          SHARING_EXPORT_REVIEWED: ${{ vars.SHARING_EXPORT_REVIEWED }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/NekoWidget.xcarchive/Products/Applications/NekoWidget.app"
          widget_path="$app_path/PlugIns/NekoWidgetWidgetExtension.appex"
          share_path="$app_path/PlugIns/NekoWidgetShareExtension.appex"
          test -f "$widget_path/PrivacyInfo.xcprivacy"
          test -f "$share_path/PrivacyInfo.xcprivacy"
          python3 "$PROJECT_DIRECTORY/ci/validate-sharing-release.py" \
            --info-plist "$app_path/Info.plist" \
            --share-info-plist "$share_path/Info.plist" \
            --privacy-manifest "$app_path/PrivacyInfo.xcprivacy" \
            --widget-privacy-manifest "$widget_path/PrivacyInfo.xcprivacy" \
            --share-privacy-manifest "$share_path/PrivacyInfo.xcprivacy" \
            --export-reviewed "${SHARING_EXPORT_REVIEWED:-NO}" \
            --expected-mode "$SHARING_EXPECTED_MODE" \
            --expected-api-origin "$RELEASE_SHARING_API_ORIGIN" \
            --expected-moderation-key-id "$RELEASE_SHARING_MODERATION_KEY_ID" \
            --expected-moderation-public-key "$RELEASE_SHARING_MODERATION_PUBLIC_KEY" \
            --expected-privacy-url "$RELEASE_SHARING_PRIVACY_URL" \
            --expected-support-url "$RELEASE_SHARING_SUPPORT_URL" \
            --expected-community-standards-url "$RELEASE_SHARING_COMMUNITY_STANDARDS_URL"

      - name: Verify archive signatures and App Group entitlements
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/NekoWidget.xcarchive/Products/Applications/NekoWidget.app"
          widget_path="$app_path/PlugIns/NekoWidgetWidgetExtension.appex"
          share_path="$app_path/PlugIns/NekoWidgetShareExtension.appex"
          app_entitlements="$RUNNER_TEMP/archive-app-entitlements.plist"
          widget_entitlements="$RUNNER_TEMP/archive-widget-entitlements.plist"
          share_entitlements="$RUNNER_TEMP/archive-share-extension-entitlements.plist"

          test -d "$app_path"
          test -d "$widget_path"
          test -d "$share_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$widget_path"
          codesign --verify --strict --verbose=2 "$share_path"
          codesign -d --entitlements "$app_entitlements" --xml "$app_path"
          codesign -d --entitlements "$widget_entitlements" --xml "$widget_path"
          codesign -d --entitlements "$share_entitlements" --xml "$share_path"
          plutil -lint "$app_entitlements"
          plutil -lint "$widget_entitlements"
          plutil -lint "$share_entitlements"

          app_display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Info.plist")"
          widget_display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$widget_path/Info.plist")"
          share_display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$share_path/Info.plist")"
          app_device_family="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$app_path/Info.plist")"
          widget_device_family="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$widget_path/Info.plist")"
          share_device_family="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$share_path/Info.plist")"

          [[ "$app_display_name" == "ねこのまど" ]]
          [[ "$widget_display_name" == "ねこのまど" ]]
          [[ "$share_display_name" == "ねこのまど" ]]
          [[ "$app_device_family" == "1" ]]
          [[ "$widget_device_family" == "1" ]]
          [[ "$share_device_family" == "1" ]]
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$app_path/Info.plist" >/dev/null 2>&1; then
            echo 'App archive contains an unexpected second UIDeviceFamily value.' >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$widget_path/Info.plist" >/dev/null 2>&1; then
            echo 'Widget archive contains an unexpected second UIDeviceFamily value.' >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$share_path/Info.plist" >/dev/null 2>&1; then
            echo 'Share Extension archive contains an unexpected second UIDeviceFamily value.' >&2
            exit 1
          fi

          app_signed_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$app_entitlements")"
          widget_signed_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$widget_entitlements")"
          share_signed_identifier="$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$share_entitlements")"
          app_signed_team="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$app_entitlements")"
          widget_signed_team="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$widget_entitlements")"
          share_signed_team="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$share_entitlements")"
          app_signed_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$app_entitlements" 2>/dev/null || true)"
          widget_signed_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$widget_entitlements" 2>/dev/null || true)"
          share_signed_groups="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$share_entitlements" 2>/dev/null || true)"
          app_safety_entitlement="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.sensitivecontentanalysis.client:0' "$app_entitlements" 2>/dev/null || true)"
          widget_safety_entitlement="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.sensitivecontentanalysis.client:0' "$widget_entitlements" 2>/dev/null || true)"
          share_safety_entitlement="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.sensitivecontentanalysis.client:0' "$share_entitlements" 2>/dev/null || true)"

          contains_exact_line() {
            local expected="$1"
            awk -v expected="$expected" '{ $1 = $1; if ($0 == expected) found = 1 } END { exit(found ? 0 : 1) }'
          }

          [[ "$app_signed_identifier" == "$APPLE_TEAM_ID.$APP_BUNDLE_ID" ]]
          [[ "$widget_signed_identifier" == "$APPLE_TEAM_ID.$WIDGET_BUNDLE_ID" ]]
          [[ "$share_signed_identifier" == "$APPLE_TEAM_ID.$SHARE_EXTENSION_BUNDLE_ID" ]]
          [[ "$app_signed_team" == "$APPLE_TEAM_ID" ]]
          [[ "$widget_signed_team" == "$APPLE_TEAM_ID" ]]
          [[ "$share_signed_team" == "$APPLE_TEAM_ID" ]]
          contains_exact_line "$APP_GROUP_ID" <<< "$app_signed_groups"
          contains_exact_line "$APP_GROUP_ID" <<< "$widget_signed_groups"
          contains_exact_line "$APP_GROUP_ID" <<< "$share_signed_groups"
          [[ "$app_safety_entitlement" == "analysis" ]]
          [[ -z "$widget_safety_entitlement" ]]
          [[ -z "$share_safety_entitlement" ]]

      - name: Generate export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed \
            -e "s|__APPLE_TEAM_ID__|$APPLE_TEAM_ID|g" \
            -e "s|__APP_BUNDLE_ID__|$APP_BUNDLE_ID|g" \
            -e "s|__WIDGET_BUNDLE_ID__|$WIDGET_BUNDLE_ID|g" \
            -e "s|__SHARE_EXTENSION_BUNDLE_ID__|$SHARE_EXTENSION_BUNDLE_ID|g" \
            -e "s|__APP_PROFILE_UUID__|$APP_PROFILE_UUID|g" \
            -e "s|__WIDGET_PROFILE_UUID__|$WIDGET_PROFILE_UUID|g" \
            -e "s|__SHARE_PROFILE_UUID__|$SHARE_PROFILE_UUID|g" \
            "$PROJECT_DIRECTORY/ci/ExportOptions.plist.template" \
            > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NekoWidget.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ipa_path="$(find "$RUNNER_TEMP/Export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "xcodebuild did not produce an IPA." >&2
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Package archive and symbols
        if: ${{ inputs.retain_signed_artifacts }}
        shell: bash
        env:
          SIGNED_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.SIGNED_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/NekoWidget.xcarchive"
          test -f "$IPA_PATH"
          ipa_directory="$(dirname "$IPA_PATH")"
          ipa_filename="$(basename "$IPA_PATH")"
          tar \
            -C "$RUNNER_TEMP" \
            -czf - \
            NekoWidget.xcarchive \
            -C "$ipa_directory" \
            "$ipa_filename" \
            | openssl enc \
                -aes-256-cbc \
                -salt \
                -pbkdf2 \
                -iter 200000 \
                -pass env:SIGNED_ARTIFACT_ENCRYPTION_PASSWORD \
                -out "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc"
          test -s "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc"
          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -pass env:SIGNED_ARTIFACT_ENCRYPTION_PASSWORD \
            -in "$RUNNER_TEMP/NekoWidget-signed-artifacts.tar.gz.enc" \
            | tar -tzf - \
            | tee "$RUNNER_TEMP/signed-artifact-contents.txt"
          grep -q '^NekoWidget.xcarchive/' "$RUNNER_TEMP/signed-artifact-contents.txt"
          grep -Fxq "$ipa_filename" "$RUNNER_TEMP/signed-artifact-contents.txt"

      - name: Upload encrypted signed app and symbols
        if: ${{ inputs.retain_signed_artifacts }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nekowidget-signed-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/NekoWidget-signed-artifacts.tar.gz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Install App Store Connect API private key
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          private_key_directory="$HOME/.appstoreconnect/private_keys"
          private_key_path="$private_key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "API_PRIVATE_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"
          mkdir -p "$private_key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$private_key_path"
          chmod 600 "$private_key_path"

      - name: Validate and upload IPA to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Write release summary
        if: always()
        shell: bash
        env:
          UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
          RETAIN_SIGNED_ARTIFACTS: ${{ inputs.retain_signed_artifacts }}
          SELECTED_RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          {
            echo "## NekoWidget release workflow"
            echo
            echo "- Upload requested: \`$UPLOAD_TO_TESTFLIGHT\`"
            echo "- Retain encrypted signed artifacts: \`$RETAIN_SIGNED_ARTIFACTS\`"
            echo "- Build number: \`${RELEASE_BUILD_NUMBER:-not resolved}\`"
            echo "- Release mode: \`${SELECTED_RELEASE_MODE}\`"
            echo "- Sharing scope: \`${RELEASE_MODE_SUMMARY:-not resolved}\`"
            if [[ "$UPLOAD_TO_TESTFLIGHT" == "true" ]]; then
              echo "- Intended result: signed archive, IPA export, validation, and TestFlight upload"
            else
              echo "- Intended result: signed archive and IPA export only; nothing is sent to App Store Connect"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${APP_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$APP_INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${WIDGET_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$WIDGET_INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${SHARE_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$SHARE_INSTALLED_PROFILE_PATH"
          fi
          if [[ -n "${CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$CI_KEYCHAIN_PATH"
          fi
          if [[ -n "${API_PRIVATE_KEY_PATH:-}" ]]; then
            rm -f "$API_PRIVATE_KEY_PATH"
          fi
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/app.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/share-extension.mobileprovision" \
            "$RUNNER_TEMP/app-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist" \
            "$RUNNER_TEMP/share-extension-profile.plist" \
            "$RUNNER_TEMP/apple-distribution.pem" \
            "$RUNNER_TEMP/apple-distribution.der" \
            "$RUNNER_TEMP/archive-app-entitlements.plist" \
            "$RUNNER_TEMP/archive-widget-entitlements.plist" \
            "$RUNNER_TEMP/archive-share-extension-entitlements.plist" \
            "$RUNNER_TEMP/signed-artifact-contents.txt" \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nekowidget-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/Export/DistributionSummary.plist
            ${{ runner.temp }}/Export/ExportOptions.plist
            ${{ runner.temp }}/NekoWidgetArchive.xcresult
          if-no-files-found: warn
          retention-days: 14
