<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-itunes-app" content="app-id=6801962436">
  <meta name="description" content="猫のお世話の記録を家族で一緒に書く「家族の手帳」に招待されています。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ねこのまど">
  <meta property="og:title" content="ねこのまど｜家族の手帳への招待">
  <meta property="og:description" content="猫のお世話の記録を家族で一緒に書く「家族の手帳」に招待されています。">
  <title>家族の手帳への招待 — ねこのまど</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .actions { display: grid; gap: 12px; margin: 24px 0 8px; }
    .button { display: block; text-align: center; text-decoration: none; font-weight: 600;
      border-radius: 14px; padding: 14px 18px; border: 1px solid var(--border); }
    .button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">ねこのまど</p>
  </header>
  <main>
    <h1>家族の手帳への招待</h1>
    <p>猫のお世話の記録を家族で一緒に書く「家族の手帳」に招待されています。参加は無料です。</p>
    <div class="actions">
      <a class="button primary" href="https://apps.apple.com/jp/app/id6801962436">App Store で入れる</a>
      <a class="button" id="open-app" href="nekowidget://family-join">アプリで開く</a>
    </div>
    <p class="updated">ねこのまどを入れたら、このページに戻って「アプリで開く」を押してください。招待リンクの期限は24時間です。</p>
    <p class="updated">このページに名前や招待コードを入力する必要はありません。招待の鍵は、リンクの「#」から後ろにあり、このサイトには送られません。</p>
  </main>
  <script>
    // The invitation lives only in the fragment; it is handed to the app and
    // never sent to this site (11/7).
    (function () {
      var hash = window.location.hash;
      if (hash && hash.length > 1) {
        document.getElementById("open-app").href = "nekowidget://family-join" + hash;
      }
    })();
  </script>
</body>
</html>
