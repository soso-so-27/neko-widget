<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-itunes-app" content="app-id=6801962436">
  <meta name="description" content="猫の写真が、ホーム画面に届きます。参加は無料です。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ねこのまど">
  <meta property="og:title" content="ねこのまど｜猫友のまどへの招待">
  <meta property="og:description" content="猫の写真が、ホーム画面に届きます。参加は無料です。">
  <title>猫友のまどへの招待 — ねこのまど</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    [hidden] { display: none !important; }
    .stage { background: var(--bg); border-radius: 22px; padding: 28px 16px 18px; text-align: center; margin-bottom: 24px; }
    .stage svg { width: min(180px, 52vw); height: auto; display: block; margin: 0 auto; }
    .stage p { margin: 14px auto 0; color: var(--muted); font-size: 0.92rem; }
    .button { display: block; text-align: center; text-decoration: none; font-weight: 600;
      border-radius: 14px; padding: 14px 18px; border: 1px solid var(--border); margin-top: 8px; }
    .button.primary { background: var(--accent); color: #fff; border-color: var(--accent); margin-top: 20px; }
    .between { text-align: center; margin: 14px 0 0; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">ねこのまど</p>
  </header>
  <main>
    <div class="stage">
      <!-- A widget drawn in place: this page cannot read the inviter's photos. -->
      <svg viewBox="0 0 180 180" role="img" aria-label="ホーム画面に届いた猫の写真">
        <rect x="0" y="0" width="180" height="180" rx="40" fill="#f3e6d3"/>
        <rect x="26" y="22" width="128" height="104" rx="10" fill="#cfe3f2"/>
        <rect x="88" y="22" width="4" height="104" fill="#f3e6d3"/>
        <rect x="26" y="72" width="128" height="4" fill="#f3e6d3"/>
        <rect x="18" y="122" width="144" height="10" rx="5" fill="#d9c3a5"/>
        <path d="M118 120 C140 118 146 100 136 92" stroke="#26221f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="96" cy="104" rx="26" ry="20" fill="#26221f"/>
        <circle cx="90" cy="76" r="19" fill="#26221f"/>
        <path d="M74 66 L76 48 L88 60 Z" fill="#26221f"/>
        <path d="M106 66 L104 48 L92 60 Z" fill="#26221f"/>
        <circle cx="83" cy="76" r="3.2" fill="#f2c94c"/>
        <circle cx="97" cy="76" r="3.2" fill="#f2c94c"/>
        <rect x="18" y="146" width="56" height="20" rx="10" fill="#ffffff"/>
        <text x="46" y="160" font-size="11" font-weight="700" text-anchor="middle" fill="#26221f">のわ</text>
      </svg>
      <p>猫友の猫が、ホーム画面に届きます</p>
    </div>
    <h1>猫友のまどに、<br>席がとってあります</h1>
    <p>参加は無料です。</p>
    <p id="android-note" class="updated" hidden>ねこのまどは、いまはiPhoneだけで使えます。</p>
    <p id="desktop-note" hidden>iPhoneでこのリンクを開いてください。</p>
    <div id="steps">
      <a class="button primary" href="https://apps.apple.com/jp/app/id6801962436">App Store で入れる</a>
      <p class="updated between">入れてあるときは</p>
      <a class="button" id="open-app" href="nekowidget://join">アプリで開く</a>
    </div>
    <p id="in-app-note" class="updated" hidden>うまく開かないときは、右上のメニューから「Safariで開く」を選んでください。</p>
    <p class="updated"><a href="/privacy/">招待リンクと鍵の扱い</a></p>
  </main>
  <script>
    // The invitation lives only in the fragment; it is handed to the app and
    // never sent to this site (11/7).
    (function () {
      var hash = window.location.hash;
      if (hash && hash.length > 1) {
        document.getElementById("open-app").href = "nekowidget://join" + hash;
      }
      // Where the page was opened decides the one extra line (11/14).
      // Only the browser's own User-Agent is read; nothing is sent anywhere.
      var ua = navigator.userAgent;
      var show = function (id) { document.getElementById(id).hidden = false; };
      var hideSteps = function () {
        document.getElementById("steps").hidden = true;
      };
      var iPadDesktopMode = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      if (/Android/i.test(ua)) {
        // Android: no app yet, so say so instead of an App Store button (11/7).
        show("android-note");
        hideSteps();
      } else if (!/iPhone|iPad|iPod/.test(ua) && !iPadDesktopMode) {
        // A computer: the app opens only on an iPhone.
        show("desktop-note");
        hideSteps();
      } else if (/\bLine\/|Instagram|FBAN|FBAV|FB_IAB|MicroMessenger/.test(ua)) {
        // An app's own browser (LINE, Instagram and the like) may not open the app.
        show("in-app-note");
      }
    })();
  </script>
</body>
</html>
